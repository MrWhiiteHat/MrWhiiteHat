<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300">
  <defs>
    <!-- Top accent stripe gradient: #00ff88 through #28c840 to #ffbd2e (Green-to-Gold) -->
    <linearGradient id="krishiTopStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#28c840" />
      <stop offset="100%" stop-color="#ffbd2e" />
    </linearGradient>

    <!-- Subtle radial background glow behind plant illustration -->
    <radialGradient id="krishiHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#28c840" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for title & focal elements -->
    <filter id="krishiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card clipping path for rounded corners -->
    <clipPath id="krishiCardClip">
      <rect x="0" y="0" width="850" height="300" rx="8" />
    </clipPath>

    <!-- Sci-Fi background cyber grid pattern -->
    <pattern id="krishiGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161b22" stroke-width="0.8" opacity="0.65" />
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: 'Consolas', 'Courier New', monospace;
    }

    .animated-border {
      stroke-dasharray: 8 4;
      animation: borderFlowKrishi 3s linear infinite;
    }

    @keyframes borderFlowKrishi {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 24; }
    }

    .pulse-anim {
      animation: pulseKrishi 2.8s ease-in-out infinite alternate;
    }

    @keyframes pulseKrishi {
      0% { opacity: 0.75; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    .status-pulse {
      animation: statusBlinkKrishi 1.8s ease-in-out infinite alternate;
    }

    @keyframes statusBlinkKrishi {
      0% { opacity: 0.45; }
      100% { opacity: 1; }
    }
  </style>

  <!-- 1. Background rounded rect -->
  <rect x="0.5" y="0.5" width="849" height="299" rx="8" fill="#0d1117" stroke="#1a1a2e" stroke-width="1" />

  <!-- Sci-fi background grid texture clipped to card -->
  <rect x="0" y="0" width="850" height="300" rx="8" fill="url(#krishiGrid)" clip-path="url(#krishiCardClip)" />

  <!-- 4. Corner Brackets: L-shaped HUD targeting reticle lines -->
  <path d="M 12,24 L 12,12 L 24,12" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.3" />
  <path d="M 838,24 L 838,12 L 826,12" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.3" />
  <path d="M 12,276 L 12,288 L 24,288" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.3" />
  <path d="M 838,276 L 838,288 L 826,288" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.3" />

  <!-- 2. TOP STRIPE: 4px gradient bar across top edge -->
  <rect x="0" y="0" width="850" height="4" fill="url(#krishiTopStripe)" clip-path="url(#krishiCardClip)" />

  <!-- 6. LEFT SIDE ILLUSTRATION (x=25-110): Stylized Seedling + Circuit fusion + Scan glow -->
  <g class="pulse-anim" style="transform-origin: 68px 138px;">
    <!-- Radial halo glow behind plant -->
    <circle cx="68" cy="138" r="46" fill="url(#krishiHalo)" />

    <!-- Circular scan field around the plant -->
    <circle cx="68" cy="138" r="42" fill="none" stroke="#00ff88" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="68" cy="138" r="30" fill="none" stroke="#28c840" stroke-width="0.6" opacity="0.4" />

    <!-- Base Circuit-Board Pattern connecting to plant (AI + Ag fusion) -->
    <g stroke="#28c840" stroke-width="1" fill="none" opacity="0.8">
      <path d="M 38,172 H 52 L 62,164 H 68" />
      <path d="M 98,172 H 84 L 74,164 H 68" />
      <path d="M 46,180 H 58 L 68,172 V 164" />
      <path d="M 90,180 H 78 L 68,172" />
      <circle cx="38" cy="172" r="1.8" fill="#28c840" stroke="none" />
      <circle cx="98" cy="172" r="1.8" fill="#28c840" stroke="none" />
      <circle cx="46" cy="180" r="1.8" fill="#00ff88" stroke="none" />
      <circle cx="90" cy="180" r="1.8" fill="#00ff88" stroke="none" />
      <!-- Base Micro-chip socket -->
      <rect x="61" y="161" width="14" height="6" rx="1.5" fill="#161b22" stroke="#28c840" stroke-width="1" />
      <circle cx="68" cy="164" r="1.5" fill="#00ff88" stroke="none" />
    </g>

    <!-- Vertical Stem (line, stroke #28c840) -->
    <line x1="68" y1="161" x2="68" y2="106" stroke="#28c840" stroke-width="2.2" stroke-linecap="round" filter="url(#krishiGlow)" />

    <!-- Two small leaves (curved paths, stroke #28c840, fill none) -->
    <!-- Left Leaf -->
    <path d="M 68,138 C 50,136 40,124 44,114 C 54,116 62,126 68,132" fill="none" stroke="#28c840" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 44,114 C 52,124 60,130 68,134" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.6" />

    <!-- Right Leaf -->
    <path d="M 68,126 C 86,124 96,112 92,102 C 82,104 74,114 68,120" fill="none" stroke="#28c840" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 92,102 C 84,112 76,118 68,122" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.6" />

    <!-- Sprout apex bud at tip -->
    <path d="M 68,106 C 65,100 65,94 68,90 C 71,94 71,100 68,106 Z" fill="none" stroke="#28c840" stroke-width="1.2" />
    <circle cx="68" cy="90" r="2.5" fill="#00ff88">
      <animate attributeName="r" values="2;3.2;2" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Scanning laser sweep line -->
    <line x1="38" y1="98" x2="98" y2="98" stroke="#00ff88" stroke-width="1.2" opacity="0.8">
      <animate attributeName="y1" values="94;168;94" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="y2" values="94;168;94" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.8s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- 8. MISSION LABEL: At top-right area (x~700) -->
  <g class="font-mono">
    <rect x="670" y="20" width="150" height="38" rx="4" fill="#161b22" stroke="#1f2937" stroke-width="1" />
    <circle cx="686" cy="39" r="3" fill="#28c840" class="status-pulse">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="698" y="33" fill="#8b949e" font-size="10px" font-weight="600" letter-spacing="1.2px">MISSION_04</text>
    <text x="698" y="47" fill="#28c840" font-size="9px" font-weight="700" letter-spacing="0.8px">CLASSIFIED: ACTIVE</text>
  </g>

  <!-- 9. PROJECT NAME: KrishiMitra in #e6edf3, font-size 22px, bold, subtle glow -->
  <text x="130" y="70" class="font-mono" fill="#e6edf3" font-size="22px" font-weight="bold" letter-spacing="0.4px" filter="url(#krishiGlow)">KrishiMitra</text>

  <!-- 10. CODENAME: [KRISHI-AI] in #28c840, font-size 14px -->
  <text x="130" y="90" class="font-mono" fill="#28c840" font-size="14px" font-weight="700" letter-spacing="1px">[KRISHI-AI]</text>

  <!-- 11. DESCRIPTION: Multi-line, font-size 12px, fill #8b949e, line-height 18px -->
  <g class="font-mono" font-size="12px" fill="#8b949e">
    <text x="130" y="115">AI-powered agricultural advisory chatbot for</text>
    <text x="130" y="133">Indian farmers. Crop disease detection, multilingual</text>
    <text x="130" y="151">voice support, weather, mandi prices &amp; schemes.</text>
  </g>

  <!-- 7. RIGHT SIDE TELEMETRY PANEL (x~720-830): Diagnostic panel -->
  <g class="font-mono" transform="translate(670, 72)">
    <rect x="0" y="0" width="150" height="98" rx="4" fill="#0a0a0a" stroke="#1a1a2e" stroke-width="1" />
    <rect x="0" y="0" width="150" height="20" rx="4" fill="#161b22" stroke="#1f2937" stroke-width="0.8" />
    <circle cx="12" cy="10" r="2.5" fill="#28c840" class="status-pulse">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="13" fill="#28c840" font-size="8px" font-weight="700" letter-spacing="0.8px">CROP.AI</text>
    <text x="64" y="13" fill="#8b949e" font-size="8px">// ADVISORY</text>

    <text x="12" y="38" fill="#8b949e" font-size="8px">LANG: <tspan fill="#e6edf3">HI/EN/OR</tspan></text>
    <text x="12" y="54" fill="#28c840" font-size="8px" font-weight="bold">ADVISORY: ON</text>
    <text x="12" y="70" fill="#8b949e" font-size="8px">DIAGNOSIS : <tspan fill="#00ff88">READY</tspan></text>
    <text x="12" y="86" fill="#8b949e" font-size="8px">MANDI LIVE: <tspan fill="#ffbd2e">SYNCED</tspan></text>

    <!-- Mini animated telemetry signal bar -->
    <rect x="94" y="50" width="46" height="5" rx="1.5" fill="#0d1117" stroke="#1f2937" stroke-width="0.6" />
    <rect x="95" y="51" width="34" height="3" rx="1" fill="#28c840" opacity="0.85">
      <animate attributeName="width" values="34;44;28;38;34" dur="2.6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 12. TECH TAGS (y~185, x~130): Badges with fill #161b22, border at 0.15 opacity matching green -->
  <g class="font-mono" transform="translate(0, 185)">
    <!-- Badge 1: Python -->
    <rect x="130" y="0" width="56" height="22" rx="4" fill="#161b22" stroke="#28c840" stroke-opacity="0.15" stroke-width="1" />
    <text x="158" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">Python</text>

    <!-- Badge 2: LangChain -->
    <rect x="194" y="0" width="76" height="22" rx="4" fill="#161b22" stroke="#28c840" stroke-opacity="0.15" stroke-width="1" />
    <text x="232" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">LangChain</text>

    <!-- Badge 3: Computer Vision -->
    <rect x="278" y="0" width="116" height="22" rx="4" fill="#161b22" stroke="#28c840" stroke-opacity="0.15" stroke-width="1" />
    <text x="336" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">Computer Vision</text>

    <!-- Badge 4: Multilingual -->
    <rect x="402" y="0" width="94" height="22" rx="4" fill="#161b22" stroke="#28c840" stroke-opacity="0.15" stroke-width="1" />
    <text x="449" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">Multilingual</text>

    <!-- Badge 5: Voice AI -->
    <rect x="504" y="0" width="68" height="22" rx="4" fill="#161b22" stroke="#28c840" stroke-opacity="0.15" stroke-width="1" />
    <text x="538" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">Voice AI</text>
  </g>

  <!-- 13. BOTTOM BAR (y~260-280): Separator line + wheat icon + Agricultural AI + ● ACTIVE -->
  <line x1="30" y1="250" x2="820" y2="250" stroke="#161b22" stroke-width="1" />
  <line x1="130" y1="250" x2="220" y2="250" stroke="#28c840" stroke-width="1" opacity="0.6" />

  <g class="font-mono">
    <!-- Left: Wheat/grain icon (simple V-shapes) + Agricultural AI in #8b949e, 10px -->
    <g transform="translate(130, 262)">
      <!-- Stem -->
      <line x1="8" y1="2" x2="8" y2="18" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round" />
      <!-- Grain heads (V-shapes along stem) -->
      <path d="M 4,5 L 8,8 L 12,5" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 3,9 L 8,12 L 13,9" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 4,13 L 8,16 L 12,13" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="8" y1="2" x2="8" y2="0" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round" />
      <text x="22" y="13" fill="#8b949e" font-size="10px">Agricultural AI</text>
    </g>

    <!-- Middle-left status metadata -->
    <g transform="translate(325, 264)">
      <text x="0" y="11" fill="#8b949e" opacity="0.5" font-size="9px">FEED: ICAR / MANDI-API</text>
      <text x="145" y="11" fill="#8b949e" opacity="0.5" font-size="9px">AUDIO: WHISPER-VOICE</text>
    </g>

    <!-- Right: Status indicator showing ● ACTIVE with pulsing green dot (#28c840) -->
    <g transform="translate(740, 264)">
      <circle cx="8" cy="8" r="6" fill="none" stroke="#28c840" stroke-width="1">
        <animate attributeName="r" values="3;9" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="8" cy="8" r="3.5" fill="#28c840">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="11" fill="#28c840" font-size="10px" font-weight="700" letter-spacing="1px">ACTIVE</text>
    </g>
  </g>

  <!-- 3. OUTER ANIMATED BORDER: Rounded rect border with stroke #28c840, stroke-dasharray 8 4 (0 to 24 over 3s) -->
  <rect class="animated-border" x="0.5" y="0.5" width="849" height="299" rx="8" fill="none" stroke="#28c840" stroke-width="1.5" stroke-opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>

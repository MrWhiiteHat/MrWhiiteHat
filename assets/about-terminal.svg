<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420">
  <defs>
    <!-- Terminal Glow Filter -->
    <filter id="terminal-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip path to keep elements inside terminal window -->
    <clipPath id="terminal-clip">
      <rect x="0" y="0" width="850" height="420" rx="8" />
    </clipPath>

    <!-- Clip path for title bar rounded top corners -->
    <clipPath id="titlebar-clip">
      <rect x="0" y="0" width="850" height="30" rx="8" />
    </clipPath>

    <!-- Vertical scanline gradient -->
    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0" />
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </linearGradient>

    <!-- India flag clip path -->
    <clipPath id="india-flag-clip">
      <rect x="0" y="0" width="16" height="11" rx="1.5" />
    </clipPath>
  </defs>

  <style>
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .term-title {
      font-size: 12px;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
    .term-text {
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .rec-indicator {
      font-size: 10px;
      fill: #8b949e;
      letter-spacing: 1px;
    }

    /* Cursor blink animation */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }

    /* Recording dot pulse */
    @keyframes recPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .rec-dot {
      animation: recPulse 2s ease-in-out infinite;
    }
    @keyframes recRingPulse {
      0%, 100% { opacity: 0.15; stroke-width: 1px; }
      50% { opacity: 0.7; stroke-width: 1.5px; }
    }
    .rec-ring {
      animation: recRingPulse 2s ease-in-out infinite;
    }

    /* Scan line vertical movement */
    @keyframes scan {
      0% { transform: translateY(0px); }
      100% { transform: translateY(390px); }
    }
    .scanline {
      animation: scan 7s linear infinite;
    }
  </style>

  <!-- Main Terminal Group clipped to rounded container -->
  <g clip-path="url(#terminal-clip)">
    <!-- Terminal Background -->
    <rect width="850" height="420" fill="#0d1117" />

    <!-- Terminal Subtle Inner Glow Frame -->
    <rect x="1" y="1" width="848" height="418" rx="8" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.12" filter="url(#terminal-glow)" />

    <!-- Title Bar -->
    <g>
      <rect width="850" height="30" fill="#161b22" />
      <line x1="0" y1="30" x2="850" y2="30" stroke="#1a1a2e" stroke-width="1" />

      <!-- Window Controls (Red, Yellow, Green) -->
      <circle cx="20" cy="15" r="5" fill="#ff5f57" />
      <circle cx="35" cy="15" r="5" fill="#ffbd2e" />
      <circle cx="50" cy="15" r="5" fill="#28c840" />

      <!-- Title Bar Center Text -->
      <text x="425" y="19" class="mono term-title" text-anchor="middle">mrwhitehat@cyberspace: ~</text>

      <!-- Recording / Live Indicator on Right -->
      <g transform="translate(770, 0)">
        <circle cx="20" cy="15" r="7" fill="none" stroke="#00ff88" class="rec-ring" />
        <circle cx="20" cy="15" r="3.5" fill="#00ff88" class="rec-dot" />
        <text x="32" y="19" class="mono rec-indicator">LIVE</text>
      </g>
    </g>

    <!-- Scan Line Decoration -->
    <rect class="scanline" x="0" y="30" width="850" height="24" fill="url(#scanline-grad)" pointer-events="none" />

    <!-- Terminal Content Area -->
    <!-- 1. $ whoami -->
    <text x="25" y="56" class="mono term-text">
      <tspan fill="#00ff88" font-weight="bold">$ </tspan>
      <tspan fill="#e6edf3">whoami</tspan>
    </text>
    <text x="25" y="74" class="mono term-text">
      <tspan fill="#00bcd4">&gt; </tspan>
      <tspan fill="#8b949e">MrWhiiteHat</tspan>
    </text>

    <!-- 2. $ cat location.txt -->
    <text x="25" y="97" class="mono term-text">
      <tspan fill="#00ff88" font-weight="bold">$ </tspan>
      <tspan fill="#e6edf3">cat location.txt</tspan>
    </text>
    <text x="25" y="115" class="mono term-text">
      <tspan fill="#00bcd4">&gt; </tspan>
      <tspan fill="#8b949e">Odisha, India </tspan>
    </text>
    <!-- India Flag Mini Badge -->
    <g transform="translate(150, 105)" clip-path="url(#india-flag-clip)">
      <rect width="16" height="3.67" y="0" fill="#ff9933" />
      <rect width="16" height="3.67" y="3.67" fill="#ffffff" />
      <rect width="16" height="3.67" y="7.33" fill="#138808" />
      <circle cx="8" cy="5.5" r="1.3" fill="#000080" />
    </g>

    <!-- 3. $ cat education.txt -->
    <text x="25" y="138" class="mono term-text">
      <tspan fill="#00ff88" font-weight="bold">$ </tspan>
      <tspan fill="#e6edf3">cat education.txt</tspan>
    </text>
    <text x="25" y="156" class="mono term-text">
      <tspan fill="#00bcd4">&gt; </tspan>
      <tspan fill="#8b949e">B.Tech &#x2014; Computer Science &amp; Engineering</tspan>
    </text>

    <!-- 4. $ cat interests.json -->
    <text x="25" y="179" class="mono term-text">
      <tspan fill="#00ff88" font-weight="bold">$ </tspan>
      <tspan fill="#e6edf3">cat interests.json</tspan>
    </text>
    <text x="25" y="196" class="mono term-text">
      <tspan fill="#00bcd4">&gt; </tspan>
      <tspan fill="#8b949e">{</tspan>
    </text>
    <text x="25" y="213" class="mono term-text">
      <tspan fill="#00bcd4">&gt;   </tspan>
      <tspan fill="#7c4dff">"ai"</tspan>
      <tspan fill="#8b949e">: </tspan>
      <tspan fill="#00ff88">"LLM-Powered Systems &amp; Autonomous Agents"</tspan>
      <tspan fill="#8b949e">,</tspan>
    </text>
    <text x="25" y="230" class="mono term-text">
      <tspan fill="#00bcd4">&gt;   </tspan>
      <tspan fill="#7c4dff">"security"</tspan>
      <tspan fill="#8b949e">: </tspan>
      <tspan fill="#00ff88">"Application &amp; Mobile Security Research"</tspan>
      <tspan fill="#8b949e">,</tspan>
    </text>
    <text x="25" y="247" class="mono term-text">
      <tspan fill="#00bcd4">&gt;   </tspan>
      <tspan fill="#7c4dff">"engineering"</tspan>
      <tspan fill="#8b949e">: </tspan>
      <tspan fill="#00ff88">"Full-Stack Software Development"</tspan>
      <tspan fill="#8b949e">,</tspan>
    </text>
    <text x="25" y="264" class="mono term-text">
      <tspan fill="#00bcd4">&gt;   </tspan>
      <tspan fill="#7c4dff">"community"</tspan>
      <tspan fill="#8b949e">: </tspan>
      <tspan fill="#00ff88">"Open-Source &amp; Developer Communities"</tspan>
    </text>
    <text x="25" y="281" class="mono term-text">
      <tspan fill="#00bcd4">&gt; </tspan>
      <tspan fill="#8b949e">}</tspan>
    </text>

    <!-- 5. $ cat achievements.txt -->
    <text x="25" y="304" class="mono term-text">
      <tspan fill="#00ff88" font-weight="bold">$ </tspan>
      <tspan fill="#e6edf3">cat achievements.txt</tspan>
    </text>

    <!-- Achievement 1: Bronze Medal -->
    <g>
      <text x="25" y="322" class="mono term-text">
        <tspan fill="#00bcd4">&gt; </tspan>
      </text>
      <!-- Bronze badge circle -->
      <circle cx="48" cy="318" r="4.5" fill="#cd7f32" />
      <circle cx="48" cy="318" r="2.5" fill="#a0522d" />
      <text x="60" y="322" class="mono term-text" fill="#e6edf3">2x Bronze Medal &#x2014; Odisha Skills (Cybersecurity)</text>
    </g>

    <!-- Achievement 2: Founded & Built Developer Communities -->
    <g>
      <text x="25" y="340" class="mono term-text">
        <tspan fill="#00bcd4">&gt; </tspan>
      </text>
      <!-- Rocket triangle icon -->
      <polygon points="48,332 52,342 44,342" fill="#00e5ff" />
      <polygon points="48,338 50,344 46,344" fill="#ff5f57" />
      <text x="60" y="340" class="mono term-text" fill="#e6edf3">Founded &amp; Built Developer Communities</text>
    </g>

    <!-- Achievement 3: Startup Experience in Tech -->
    <g>
      <text x="25" y="358" class="mono term-text">
        <tspan fill="#00bcd4">&gt; </tspan>
      </text>
      <!-- Flask / cyan circle icon -->
      <circle cx="48" cy="354" r="4.5" fill="#00e5ff" />
      <circle cx="48" cy="354" r="2" fill="#0d1117" />
      <text x="60" y="358" class="mono term-text" fill="#e6edf3">Startup Experience in Tech</text>
    </g>

    <!-- 6. $ echo $STATUS -->
    <text x="25" y="381" class="mono term-text">
      <tspan fill="#00ff88" font-weight="bold">$ </tspan>
      <tspan fill="#e6edf3">echo $STATUS</tspan>
    </text>
    <text x="25" y="399" class="mono term-text">
      <tspan fill="#00bcd4">&gt; </tspan>
      <tspan fill="#e6edf3" font-weight="bold">ALWAYS BUILDING </tspan>
      <tspan fill="#00ff88" class="cursor">&#x25ae;</tspan>
    </text>
  </g>

  <!-- Outer Frame Border (1px stroke #1a1a2e) -->
  <rect x="0.5" y="0.5" width="849" height="419" rx="8" fill="none" stroke="#1a1a2e" stroke-width="1" />
</svg>

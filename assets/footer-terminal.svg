<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="850" height="200" aria-label="Terminal Footer">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-green-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-text" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanline Moving Beam Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0" />
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </linearGradient>

    <!-- Background Ambient Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1" />
    </linearGradient>

    <!-- Pattern for Static Scanlines -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35" />
    </pattern>

    <style>
      @keyframes blinkCursor {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes headerGlowPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #00ff88); }
      }
      @keyframes borderPulse {
        0%, 100% { stroke-opacity: 0.15; }
        50% { stroke-opacity: 0.35; }
      }

      .term-cursor {
        animation: blinkCursor 1s step-end infinite;
      }
      .header-title {
        animation: headerGlowPulse 4s ease-in-out infinite;
      }
      .frame-bracket {
        animation: borderPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. BACKGROUND CONTAINER (fill #0d1117, stroke #1a1a2e, rx=8) -->
  <rect
    x="1"
    y="1"
    width="848"
    height="198"
    rx="8"
    fill="#0d1117"
    stroke="#1a1a2e"
    stroke-width="1.5"
  />
  <rect
    x="1"
    y="1"
    width="848"
    height="198"
    rx="8"
    fill="url(#bgGrad)"
  />

  <!-- Subtle CRT Scanline Texture -->
  <rect
    x="2"
    y="2"
    width="846"
    height="196"
    rx="7"
    fill="url(#scanlines)"
    pointer-events="none"
  />

  <!-- SUBTLE ANIMATED SCANLINE BEAM (moving top to bottom) -->
  <rect
    x="2"
    y="0"
    width="846"
    height="28"
    fill="url(#scanBeam)"
    pointer-events="none"
  >
    <animate
      attributeName="y"
      from="-28"
      to="200"
      dur="7s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- DECORATIVE CORNER HUD BRACKETS -->
  <g class="frame-bracket" stroke="#00ff88" stroke-width="1.5" fill="none">
    <!-- Top-Left -->
    <path d="M 8 22 L 8 8 L 22 8" />
    <!-- Top-Right -->
    <path d="M 828 8 L 842 8 L 842 22" />
    <!-- Bottom-Left -->
    <path d="M 8 178 L 8 192 L 22 192" />
    <!-- Bottom-Right -->
    <path d="M 828 192 L 842 192 L 842 178" />
  </g>

  <!-- TOP TERMINAL ACCENTS (Left dots & Right session status) -->
  <g transform="translate(26, 26)">
    <circle cx="0" cy="0" r="3.5" fill="#ff5f56" opacity="0.65" />
    <circle cx="12" cy="0" r="3.5" fill="#ffbd2e" opacity="0.65" />
    <circle cx="24" cy="0" r="3.5" fill="#00ff88" opacity="0.75" />
  </g>

  <g transform="translate(824, 28)">
    <text
      x="0"
      y="0"
      text-anchor="end"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="9"
      fill="#8b949e"
      opacity="0.6"
      letter-spacing="1"
    >SYS://HALT_SIG</text>
  </g>

  <!-- 2. SECTION HEADER (y~30): ⟨ /END TRANSMISSION ⟩ in #00ff88, font-size 14px, centered, glow -->
  <text
    class="header-title"
    x="425"
    y="30"
    text-anchor="middle"
    font-family="'Consolas', 'Courier New', monospace"
    font-size="14"
    font-weight="600"
    fill="#00ff88"
    letter-spacing="3"
    filter="url(#glow-green-subtle)"
  >&#x27E8; /END TRANSMISSION &#x27E9;</text>

  <!-- TOP SECTION DIVIDER ACCENT -->
  <line x1="280" y1="44" x2="570" y2="44" stroke="#00ff88" stroke-width="0.8" opacity="0.2" />
  <circle cx="425" cy="44" r="1.5" fill="#00ff88" opacity="0.5" />

  <!-- 3. PHILOSOPHY QUOTE (y~70, centered) -->
  <!-- > BUILDING INTELLIGENT SYSTEMS. EXPLORING WHAT'S NEXT. -->
  <text
    x="425"
    y="72"
    text-anchor="middle"
    font-family="'Consolas', 'Courier New', monospace"
    font-size="16"
    font-weight="600"
    letter-spacing="1"
  >
    <tspan fill="#00ff88" font-weight="bold" filter="url(#glow-green-subtle)">&gt; </tspan>
    <tspan fill="#e6edf3" filter="url(#glow-text)">BUILDING INTELLIGENT SYSTEMS. EXPLORING WHAT&apos;S NEXT.</tspan>
  </text>

  <!-- 4. TERMINAL CLOSING (y~110, centered) -->
  <!-- Line 1: mrwhitehat@cyberspace:~$ logout [blinking cursor] -->
  <g transform="translate(425, 108)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="12"
      letter-spacing="0.5"
    >
      <tspan fill="#8b949e">mrwhitehat@cyberspace:</tspan>
      <tspan fill="#00e5ff">~</tspan>
      <tspan fill="#00ff88">$ </tspan>
      <tspan fill="#e6edf3">logout</tspan>
      <tspan class="term-cursor" fill="#00ff88"> &#x2588;</tspan>
    </text>
  </g>

  <!-- Line 2: Connection to the future closed. (font-size 11px, fill #8b949e) -->
  <text
    x="425"
    y="126"
    text-anchor="middle"
    font-family="'Consolas', 'Courier New', monospace"
    font-size="11"
    fill="#8b949e"
    letter-spacing="0.5"
  >Connection to the future closed.</text>

  <!-- 5. DECORATIONS: Thin horizontal line above bottom bar (stroke #00ff88, opacity 0.15) -->
  <line
    x1="80"
    y1="148"
    x2="770"
    y2="148"
    stroke="#00ff88"
    stroke-width="1"
    opacity="0.15"
  />
  <!-- Central Tech Diamond on separator -->
  <polygon points="425,145 428,148 425,151 422,148" fill="#00ff88" opacity="0.4" />
  <circle cx="225" cy="148" r="1.5" fill="#00ff88" opacity="0.25" />
  <circle cx="625" cy="148" r="1.5" fill="#00ff88" opacity="0.25" />

  <!-- 5. BOTTOM BAR (y~160-180) -->
  <!-- Centered text: [ Crafted with code and curiosity ] in #8b949e, font-size 10px -->
  <text
    x="425"
    y="167"
    text-anchor="middle"
    font-family="'Consolas', 'Courier New', monospace"
    font-size="10"
    fill="#8b949e"
    letter-spacing="1.5"
  >[ Crafted with code and curiosity ]</text>

  <!-- Below: Current year © 2026 MrWhiiteHat in #8b949e, font-size 9px -->
  <text
    x="425"
    y="184"
    text-anchor="middle"
    font-family="'Consolas', 'Courier New', monospace"
    font-size="9"
    fill="#8b949e"
    opacity="0.8"
    letter-spacing="1"
  >&#xA9; 2026 MrWhiiteHat</text>
</svg>

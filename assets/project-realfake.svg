<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300">
  <defs>
    <!-- Top accent stripe gradient: #ff5f57 through #ffbd2e to #00ff88 -->
    <linearGradient id="realfakeTopStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5f57" />
      <stop offset="50%" stop-color="#ffbd2e" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <!-- Radial ambient glow behind eye illustration -->
    <radialGradient id="realfakeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbd2e" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#ff5f57" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="realfakeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card clipping path -->
    <clipPath id="realfakeCardClip">
      <rect x="0" y="0" width="850" height="300" rx="8" />
    </clipPath>

    <!-- Sci-Fi background grid -->
    <pattern id="realfakeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161b22" stroke-width="0.8" opacity="0.65" />
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: 'Consolas', 'Courier New', monospace;
    }

    .animated-border {
      stroke-dasharray: 8 4;
      animation: borderFlowRealFake 3s linear infinite;
    }

    @keyframes borderFlowRealFake {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 24; }
    }

    .pulse-anim {
      animation: pulseRealFake 2.8s ease-in-out infinite alternate;
    }

    @keyframes pulseRealFake {
      0% { opacity: 0.8; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    .status-pulse {
      animation: statusBlinkRealFake 1.8s ease-in-out infinite alternate;
    }

    @keyframes statusBlinkRealFake {
      0% { opacity: 0.45; }
      100% { opacity: 1; }
    }
  </style>

  <!-- 1. Background rounded rect -->
  <rect x="0.5" y="0.5" width="849" height="299" rx="8" fill="#0d1117" stroke="#1a1a2e" stroke-width="1" />

  <!-- Sci-fi background grid texture -->
  <rect x="0" y="0" width="850" height="300" rx="8" fill="url(#realfakeGrid)" clip-path="url(#realfakeCardClip)" />

  <!-- Futuristic HUD corner brackets -->
  <path d="M 12,24 L 12,12 L 24,12" fill="none" stroke="#ffbd2e" stroke-width="1.2" opacity="0.4" />
  <path d="M 838,24 L 838,12 L 826,12" fill="none" stroke="#ffbd2e" stroke-width="1.2" opacity="0.4" />
  <path d="M 12,276 L 12,288 L 24,288" fill="none" stroke="#ffbd2e" stroke-width="1.2" opacity="0.4" />
  <path d="M 838,276 L 838,288 L 826,288" fill="none" stroke="#ffbd2e" stroke-width="1.2" opacity="0.4" />

  <!-- 2. TOP STRIPE: 4px gradient bar across top edge -->
  <rect x="0" y="0" width="850" height="4" fill="url(#realfakeTopStripe)" clip-path="url(#realfakeCardClip)" />

  <!-- 3. LEFT SIDE ILLUSTRATION (x=30-100): Eye shape + Crosshair / Reticle + Scan animation -->
  <g class="pulse-anim" style="transform-origin: 66px 138px;">
    <!-- Radial halo glow -->
    <circle cx="66" cy="138" r="46" fill="url(#realfakeHalo)" />

    <!-- Eye outline (two arcs forming an eye outline, stroke #ffbd2e) -->
    <path d="M 36,138 Q 66,110 96,138 Q 66,166 36,138 Z" fill="#161b22" stroke="#ffbd2e" stroke-width="1.8" filter="url(#realfakeGlow)" />

    <!-- Inner sclera ring -->
    <path d="M 42,138 Q 66,116 90,138 Q 66,160 42,138 Z" fill="#0a0a0a" stroke="#ffbd2e" stroke-width="0.6" stroke-opacity="0.35" />

    <!-- Iris Circle -->
    <circle cx="66" cy="138" r="14" fill="#161b22" stroke="#ff5f57" stroke-width="1.4" />

    <!-- Center Pupil -->
    <circle cx="66" cy="138" r="5" fill="#ff5f57" />

    <!-- Detection Crosshair Reticle -->
    <circle cx="66" cy="138" r="9" fill="none" stroke="#ffbd2e" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.75" />
    <line x1="66" y1="120" x2="66" y2="126" stroke="#ffbd2e" stroke-width="1.2" />
    <line x1="66" y1="150" x2="66" y2="156" stroke="#ffbd2e" stroke-width="1.2" />
    <line x1="48" y1="138" x2="54" y2="138" stroke="#ffbd2e" stroke-width="1.2" />
    <line x1="78" y1="138" x2="84" y2="138" stroke="#ffbd2e" stroke-width="1.2" />

    <!-- Subtle scan animation: sweeping vertical laser line across the eye -->
    <line x1="66" y1="116" x2="66" y2="160" stroke="#ffbd2e" stroke-width="1.6" opacity="0.85">
      <animate attributeName="x1" values="40;92;40" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="40;92;40" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- 4. MISSION LABEL (Top-Right Area): MISSION_03, CLASSIFIED: RESEARCH -->
  <g class="font-mono">
    <rect x="660" y="20" width="160" height="38" rx="4" fill="#161b22" stroke="#1f2937" stroke-width="1" />
    <circle cx="676" cy="39" r="3" fill="#ffbd2e" class="status-pulse">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="688" y="33" fill="#8b949e" font-size="10px" font-weight="600" letter-spacing="1.2px">MISSION_03</text>
    <text x="688" y="47" fill="#ffbd2e" font-size="9px" font-weight="700" letter-spacing="0.8px">CLASSIFIED: RESEARCH</text>
  </g>

  <!-- 5. PROJECT NAME: RealFake Detection in #e6edf3, font-size 22px -->
  <text x="130" y="70" class="font-mono" fill="#e6edf3" font-size="22px" font-weight="bold" letter-spacing="0.4px" filter="url(#realfakeGlow)">RealFake Detection</text>

  <!-- 6. CODENAME: Below name, [DEEPFAKE-DETECT] in #ffbd2e, font-size 14px -->
  <text x="130" y="93" class="font-mono" fill="#ffbd2e" font-size="14px" font-weight="700" letter-spacing="1px">[DEEPFAKE-DETECT]</text>

  <!-- 7. DESCRIPTION (multi-line, font-size 12px, fill #8b949e, starting y~110, x~130) -->
  <g class="font-mono" font-size="12px" fill="#8b949e">
    <text x="130" y="118">AI-powered deepfake detection system using</text>
    <text x="130" y="136">computer vision and deep learning. Real-time</text>
    <text x="130" y="154">media authenticity verification.</text>
  </g>

  <!-- Sci-Fi Telemetry Panel (Right Side) -->
  <g class="font-mono" transform="translate(560, 72)">
    <rect x="0" y="0" width="260" height="98" rx="4" fill="#161b22" fill-opacity="0.65" stroke="#1f2937" stroke-width="1" />
    <rect x="0" y="0" width="260" height="20" rx="4" fill="#1a1a2e" fill-opacity="0.8" />
    <text x="10" y="14" fill="#8b949e" font-size="9px" font-weight="600" letter-spacing="0.8px">SYS.TELEMETRY // REALFAKE-CV</text>
    
    <text x="10" y="38" fill="#8b949e" font-size="9px">VISION BACKBONE: <tspan fill="#e6edf3">EfficientNet-B4</tspan></text>
    <text x="10" y="54" fill="#8b949e" font-size="9px">INPUT PIPELINE : <tspan fill="#ffbd2e">Face Crop / FFT</tspan></text>
    <text x="10" y="70" fill="#8b949e" font-size="9px">INFERENCE RATE : <tspan fill="#e6edf3">60 FPS Realtime</tspan></text>
    <text x="10" y="86" fill="#8b949e" font-size="9px">AUTHENTICITY   : <tspan fill="#ffbd2e" font-weight="bold">VERIFIED [99.2%]</tspan></text>
    
    <!-- Mini telemetry activity indicator -->
    <rect x="175" y="78" width="70" height="8" rx="2" fill="#0d1117" stroke="#1f2937" stroke-width="0.8" />
    <rect x="177" y="80" width="52" height="4" rx="1" fill="#ffbd2e" opacity="0.85">
      <animate attributeName="width" values="52;66;46;60;52" dur="2.6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 8. TECH TAGS (y~185, x~130): Python, PyTorch, OpenCV, Deep Learning, CNN (strokes in warm tones) -->
  <g class="font-mono" transform="translate(0, 185)">
    <!-- Badge 1: Python -->
    <rect x="130" y="0" width="56" height="22" rx="4" fill="#161b22" stroke="#ffbd2e" stroke-opacity="0.25" stroke-width="1" />
    <text x="158" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">Python</text>

    <!-- Badge 2: PyTorch -->
    <rect x="194" y="0" width="62" height="22" rx="4" fill="#161b22" stroke="#ffbd2e" stroke-opacity="0.25" stroke-width="1" />
    <text x="225" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">PyTorch</text>

    <!-- Badge 3: OpenCV -->
    <rect x="264" y="0" width="56" height="22" rx="4" fill="#161b22" stroke="#ffbd2e" stroke-opacity="0.25" stroke-width="1" />
    <text x="292" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">OpenCV</text>

    <!-- Badge 4: Deep Learning -->
    <rect x="328" y="0" width="100" height="22" rx="4" fill="#161b22" stroke="#ffbd2e" stroke-opacity="0.25" stroke-width="1" />
    <text x="378" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">Deep Learning</text>

    <!-- Badge 5: CNN -->
    <rect x="436" y="0" width="38" height="22" rx="4" fill="#161b22" stroke="#ffbd2e" stroke-opacity="0.25" stroke-width="1" />
    <text x="455" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">CNN</text>
  </g>

  <!-- 9. BOTTOM BAR (y~260-280): Camera icon + Computer Vision on left. ● RESEARCH in #ffbd2e on right -->
  <!-- Separator line -->
  <line x1="30" y1="250" x2="820" y2="250" stroke="#161b22" stroke-width="1" />
  <line x1="130" y1="250" x2="220" y2="250" stroke="#ffbd2e" stroke-width="1" opacity="0.6" />

  <g class="font-mono">
    <!-- Left: Camera icon (simple rect with circle) + Computer Vision -->
    <g transform="translate(130, 262)">
      <!-- Camera Body -->
      <rect x="0" y="4" width="16" height="12" rx="2" fill="none" stroke="#8b949e" stroke-width="1.2" />
      <!-- Top Shutter Button -->
      <rect x="3" y="1" width="4" height="3" rx="0.5" fill="#8b949e" />
      <!-- Lens -->
      <circle cx="8" cy="10" r="3.2" fill="none" stroke="#8b949e" stroke-width="1.2" />
      <circle cx="8" cy="10" r="1.2" fill="#8b949e" />
      <!-- Flash -->
      <circle cx="13" cy="7" r="0.8" fill="#8b949e" />

      <text x="24" y="13" fill="#8b949e" font-size="10px">Computer Vision</text>
    </g>

    <!-- Middle-left status metadata -->
    <g transform="translate(325, 264)">
      <text x="0" y="11" fill="#8b949e" opacity="0.5" font-size="9px">DATASET: FF++ / CELEB-DF</text>
      <text x="145" y="11" fill="#8b949e" opacity="0.5" font-size="9px">ROC-AUC: 0.994</text>
    </g>

    <!-- Right: Status indicator showing ● RESEARCH in #ffbd2e -->
    <g transform="translate(720, 264)">
      <circle cx="8" cy="8" r="6" fill="none" stroke="#ffbd2e" stroke-width="1">
        <animate attributeName="r" values="3;9" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="8" cy="8" r="3.5" fill="#ffbd2e">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="11" fill="#ffbd2e" font-size="10px" font-weight="700" letter-spacing="1px">RESEARCH</text>
    </g>
  </g>

  <!-- 10. ANIMATED BORDER: Dash animation with #ffbd2e stroke (0 to 24 over 3s) -->
  <rect class="animated-border" x="0.5" y="0.5" width="849" height="299" rx="8" fill="none" stroke="#ffbd2e" stroke-width="1.5" stroke-opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>

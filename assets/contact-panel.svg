<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="850" height="160" aria-label="Establish Connection Panel">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="panelBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1" />
    </linearGradient>

    <radialGradient id="ghAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="liAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes pulseBorderGH {
        0%, 100% { stroke-opacity: 0.18; }
        50% { stroke-opacity: 0.55; }
      }
      @keyframes pulseBorderLI {
        0%, 100% { stroke-opacity: 0.18; }
        50% { stroke-opacity: 0.55; }
      }
      @keyframes pulseBorderEM {
        0%, 100% { stroke-opacity: 0.18; }
        50% { stroke-opacity: 0.55; }
      }

      @keyframes wavePulseA {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.65; }
      }
      @keyframes wavePulseB {
        0%, 100% { opacity: 0.05; }
        50% { opacity: 0.45; }
      }
      @keyframes wavePulseC {
        0%, 100% { opacity: 0.02; }
        50% { opacity: 0.3; }
      }

      @keyframes auraBreath {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 0.85; transform: scale(1.15); }
      }

      .card-gh-box { animation: pulseBorderGH 3.6s ease-in-out infinite 0s; }
      .card-li-box { animation: pulseBorderLI 3.6s ease-in-out infinite 1.2s; }
      .card-em-box { animation: pulseBorderEM 3.6s ease-in-out infinite 2.4s; }

      .sig-wave-1 { animation: wavePulseA 2.2s ease-in-out infinite; }
      .sig-wave-2 { animation: wavePulseB 2.2s ease-in-out infinite 0.4s; }
      .sig-wave-3 { animation: wavePulseC 2.2s ease-in-out infinite 0.8s; }

      .aura-pulse { animation: auraBreath 4s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- 1. BACKGROUND (fill #0d1117, stroke #1a1a2e, rx=8) -->
  <rect
    x="1"
    y="1"
    width="848"
    height="158"
    rx="8"
    fill="#0d1117"
    stroke="#1a1a2e"
    stroke-width="1.5"
  />
  <rect
    x="1"
    y="1"
    width="848"
    height="158"
    rx="8"
    fill="url(#panelBgGrad)"
  />

  <!-- OUTER CORNER HUD BRACKETS -->
  <g stroke="#00e5ff" stroke-width="1.2" opacity="0.4" fill="none">
    <path d="M 8 18 L 8 8 L 18 8" />
    <path d="M 832 8 L 842 8 L 842 18" />
    <path d="M 8 142 L 8 152 L 18 152" />
    <path d="M 832 152 L 842 152 L 842 142" />
  </g>

  <!-- 2. HEADER (y~30): ⟨ ESTABLISH CONNECTION ⟩ in #00e5ff, font-size 16px, centered, glow -->
  <text
    x="425"
    y="30"
    text-anchor="middle"
    font-family="'Consolas', 'Courier New', monospace"
    font-size="16"
    font-weight="600"
    fill="#00e5ff"
    letter-spacing="3"
    filter="url(#glow-cyan)"
  >&#x27E8; ESTABLISH CONNECTION &#x27E9;</text>

  <!-- SUBTLE CONNECTOR LINES BETWEEN CARDS -->
  <!-- Link from Card 1 to Card 2 -->
  <line x1="295" y1="86" x2="335" y2="86" stroke="#00ff88" stroke-width="1" opacity="0.25" stroke-dasharray="2 3" />
  <circle cx="315" cy="86" r="1.5" fill="#00ff88" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Link from Card 2 to Card 3 -->
  <line x1="515" y1="86" x2="555" y2="86" stroke="#7c4dff" stroke-width="1" opacity="0.25" stroke-dasharray="2 3" />
  <circle cx="535" cy="86" r="1.5" fill="#7c4dff" opacity="0.4">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Bottom bus interconnection line -->
  <line x1="205" y1="126" x2="645" y2="126" stroke="#00e5ff" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.12" />

  <!-- 3. CONTACT ITEMS (Three items in a row, centered horizontally, spaced ~220px apart) -->

  <!-- ==================== ITEM A: GITHUB (Center x = 205) ==================== -->
  <g id="contact-github">
    <!-- Card Container (rounded rect, stroke at 0.15 opacity, pulsing border) -->
    <rect
      class="card-gh-box"
      x="115"
      y="50"
      width="180"
      height="72"
      rx="6"
      fill="#161b22"
      fill-opacity="0.5"
      stroke="#00ff88"
      stroke-width="1.2"
    />

    <!-- Hover/Pulse Aura Simulation (green tint) -->
    <circle class="aura-pulse" cx="205" cy="67" r="28" fill="url(#ghAura)" pointer-events="none" />

    <!-- Signal / Wave Lines Emanating from Icon (small arcs, low opacity, pulsing) -->
    <path class="sig-wave-1" d="M 193 63 A 14 14 0 0 1 217 63" fill="none" stroke="#00ff88" stroke-width="0.9" />
    <path class="sig-wave-2" d="M 189 59 A 19 19 0 0 1 221 59" fill="none" stroke="#00ff88" stroke-width="0.8" />
    <path class="sig-wave-3" d="M 185 55 A 24 24 0 0 1 225 55" fill="none" stroke="#00ff88" stroke-width="0.7" />

    <!-- GitHub Icon: Circle with two small arcs (simplified octocat-like shape), stroke #e6edf3 -->
    <g transform="translate(205, 67)">
      <!-- Main head circle -->
      <circle cx="0" cy="1" r="8.5" fill="none" stroke="#e6edf3" stroke-width="1.3" />
      <!-- Cat ears -->
      <path
        d="M -6.5 -3.5 L -4.5 -7.5 L -1.5 -4.5 M 1.5 -4.5 L 4.5 -7.5 L 6.5 -3.5"
        stroke="#e6edf3"
        stroke-width="1.3"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <!-- Face arc -->
      <path d="M -5 3.5 Q 0 6.5 5 3.5" stroke="#e6edf3" stroke-width="1.1" fill="none" />
      <!-- Subtle node light -->
      <circle cx="0" cy="1" r="1.2" fill="#00ff88" opacity="0.8" filter="url(#glow-green)" />
    </g>

    <!-- Text: GitHub (#e6edf3, font-size 12px) -->
    <text
      x="205"
      y="93"
      text-anchor="middle"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="12"
      font-weight="600"
      fill="#e6edf3"
      letter-spacing="0.5"
    >GitHub</text>

    <!-- Subtext: @MrWhiiteHat (#8b949e, font-size 10px) -->
    <text
      x="205"
      y="108"
      text-anchor="middle"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="10"
      fill="#8b949e"
      letter-spacing="0.5"
    >@MrWhiiteHat</text>
  </g>

  <!-- ==================== ITEM B: LINKEDIN (Center x = 425) ==================== -->
  <g id="contact-linkedin">
    <!-- Card Container (rounded rect, stroke at 0.15 opacity, pulsing border) -->
    <rect
      class="card-li-box"
      x="335"
      y="50"
      width="180"
      height="72"
      rx="6"
      fill="#161b22"
      fill-opacity="0.5"
      stroke="#00e5ff"
      stroke-width="1.2"
    />

    <!-- Hover/Pulse Aura Simulation (cyan tint) -->
    <circle class="aura-pulse" cx="425" cy="67" r="28" fill="url(#liAura)" pointer-events="none" />

    <!-- Signal / Wave Lines Emanating from Icon -->
    <path class="sig-wave-1" d="M 412 62 A 15 15 0 0 1 438 62" fill="none" stroke="#00e5ff" stroke-width="0.9" />
    <path class="sig-wave-2" d="M 408 58 A 20 20 0 0 1 442 58" fill="none" stroke="#00e5ff" stroke-width="0.8" />
    <path class="sig-wave-3" d="M 404 54 A 25 25 0 0 1 446 54" fill="none" stroke="#00e5ff" stroke-width="0.7" />

    <!-- LinkedIn Icon: Rounded rect with letters 'in' inside, stroke #00e5ff -->
    <g transform="translate(425, 67)">
      <!-- Outer boundary rect -->
      <rect
        x="-10.5"
        y="-10"
        width="21"
        height="20"
        rx="3.5"
        fill="none"
        stroke="#00e5ff"
        stroke-width="1.3"
      />
      <!-- Letter 'i' -->
      <circle cx="-5" cy="-5" r="1.1" fill="#00e5ff" />
      <line x1="-5" y1="-2" x2="-5" y2="5" stroke="#00e5ff" stroke-width="1.3" stroke-linecap="round" />
      <!-- Letter 'n' -->
      <line x1="-0.5" y1="-2" x2="-0.5" y2="5" stroke="#00e5ff" stroke-width="1.3" stroke-linecap="round" />
      <path
        d="M -0.5 0.5 Q 0 -2 3 -2 Q 6 -2 6 0.5 V 5"
        fill="none"
        stroke="#00e5ff"
        stroke-width="1.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <!-- Text: LinkedIn (#e6edf3, font-size 12px) -->
    <text
      x="425"
      y="93"
      text-anchor="middle"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="12"
      font-weight="600"
      fill="#e6edf3"
      letter-spacing="0.5"
    >LinkedIn</text>

    <!-- Subtext: Connect (#8b949e, font-size 10px) -->
    <text
      x="425"
      y="108"
      text-anchor="middle"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="10"
      fill="#8b949e"
      letter-spacing="0.5"
    >Connect</text>
  </g>

  <!-- ==================== ITEM C: EMAIL (Center x = 645) ==================== -->
  <g id="contact-email">
    <!-- Card Container (rounded rect, stroke at 0.15 opacity, pulsing border) -->
    <rect
      class="card-em-box"
      x="555"
      y="50"
      width="180"
      height="72"
      rx="6"
      fill="#161b22"
      fill-opacity="0.5"
      stroke="#7c4dff"
      stroke-width="1.2"
    />

    <!-- Hover/Pulse Aura Simulation (violet tint) -->
    <circle class="aura-pulse" cx="645" cy="67" r="28" fill="url(#emAura)" pointer-events="none" />

    <!-- Signal / Wave Lines Emanating from Icon -->
    <path class="sig-wave-1" d="M 632 62 A 15 15 0 0 1 658 62" fill="none" stroke="#7c4dff" stroke-width="0.9" />
    <path class="sig-wave-2" d="M 628 58 A 20 20 0 0 1 662 58" fill="none" stroke="#7c4dff" stroke-width="0.8" />
    <path class="sig-wave-3" d="M 624 54 A 25 25 0 0 1 666 54" fill="none" stroke="#7c4dff" stroke-width="0.7" />

    <!-- Email Icon: Simple envelope shape (rect with V-shape on top), stroke #7c4dff -->
    <g transform="translate(645, 67)">
      <!-- Envelope boundary -->
      <rect
        x="-11"
        y="-8"
        width="22"
        height="16"
        rx="2.5"
        fill="none"
        stroke="#7c4dff"
        stroke-width="1.3"
      />
      <!-- V-flap fold -->
      <polyline
        points="-11,-6 0,2 11,-6"
        fill="none"
        stroke="#7c4dff"
        stroke-width="1.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Bottom inner corner fold accents -->
      <line x1="-11" y1="8" x2="-4" y2="2" stroke="#7c4dff" stroke-width="0.8" opacity="0.4" />
      <line x1="11" y1="8" x2="4" y2="2" stroke="#7c4dff" stroke-width="0.8" opacity="0.4" />
    </g>

    <!-- Text: Email (#e6edf3, font-size 12px) -->
    <text
      x="645"
      y="93"
      text-anchor="middle"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="12"
      font-weight="600"
      fill="#e6edf3"
      letter-spacing="0.5"
    >Email</text>

    <!-- Subtext: Reach Out (#8b949e, font-size 10px) -->
    <text
      x="645"
      y="108"
      text-anchor="middle"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="10"
      fill="#8b949e"
      letter-spacing="0.5"
    >Reach Out</text>
  </g>

  <!-- 6. BOTTOM (y~140): Small text `// Secure channels active` in #8b949e, font-size 9px, centered -->
  <g transform="translate(425, 142)">
    <!-- Pulsing active status beacon -->
    <circle cx="-92" cy="-3.5" r="2.5" fill="#00ff88" filter="url(#glow-green)">
      <animate attributeName="opacity" values="0.35; 1; 0.35" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="9"
      fill="#8b949e"
      letter-spacing="1.5"
    >// Secure channels active</text>
  </g>
</svg>

imation-duration:11.7s;animation-delay:-13.8s"/><circle cx="990" cy="158" r="1.5" fill="#a78bfa" class="p" style="animation-duration:6.7s;animation-delay:-2.1s"/><circle cx="22" cy="288" r="1.5" fill="#ffffff" class="p" style="animation-duration:8.1s;animation-delay:-0.1s"/><circle cx="557" cy="229" r="2" fill="#22d3ee" class="p" style="animation-duration:13.6s;animation-delay:-9.7s"/><circle cx="477" cy="240" r="2.5" fill="#ffffff" class="p" style="animation-duration:9.2s;animation-delay:-1.4s"/><circle cx="73" cy="137" r="1" fill="#22d3ee" class="p" style="animation-duration:13.9s;animation-delay:-6.2s"/><circle cx="358" cy="66" r="1" fill="#22d3ee" class="p" style="animation-duration:6.0s;animation-delay:-2.1s"/><circle cx="981" cy="226" r="1" fill="#ffffff" class="p" style="animation-duration:6.6s;animation-delay:-2.9s"/><circle cx="162" cy="169" r="2" fill="#22d3ee" class="p" style="animation-duration:10.8s;animation-delay:-6.6s"/><circle cx="879" cy="289" r="2.5" fill="#a78bfa" class="p" style="animation-duration:9.8s;animation-delay:-4.4s"/><circle cx="114" cy="215" r="2" fill="#22d3ee" class="p" style="animation-duration:9.8s;animation-delay:-9.7s"/><circle cx="220" cy="225" r="1.5" fill="#34d399" class="p" style="animation-duration:11.5s;animation-delay:-12.8s"/><circle cx="668" cy="86" r="2" fill="#34d399" class="p" style="animation-duration:10.1s;animation-delay:-12.7s"/><circle cx="800" cy="154" r="2" fill="#a78bfa" class="p" style="animation-duration:11.1s;animation-delay:-8.6s"/><circle cx="835" cy="162" r="2.5" fill="#ffffff" class="p" style="animation-duration:11.9s;animation-delay:-3.2s"/><circle cx="374" cy="54" r="1" fill="#a78bfa" class="p" style="animation-duration:12.3s;animation-delay:-6.6s"/><circle cx="719" cy="216" r="2.5" fill="#34d399" class="p" style="animation-duration:12.5s;animation-delay:-10.1s"/>
<rect width="1000" height="90" fill="url(#scan)"><animate attributeName="y" values="-90;300" dur="4.5s" repeatCount="indefinite"/></rect>
<g class="pulse" filter="url(#glow)">
<circle cx="850" cy="150" r="92" fill="none" stroke="#22d3ee" stroke-opacity=".25"/>
<g class="ring"><circle cx="850" cy="150" r="80" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="14 10"/></g>
<g class="ring2"><circle cx="850" cy="150" r="64" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 8"/></g>
<path d="M850 108 L884 121 V152 C884 174 870 190 850 198 C830 190 816 174 816 152 V121 Z" fill="#0b1730" stroke="#22d3ee" stroke-width="3"/>
<path d="M835 152 l11 11 l20 -24" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="60" y="140" class="t" fill="url(#tt)" filter="url(#glow)">MrWhiiteHat</text>
<text x="64" y="188" class="s">SADASHIBA SARANGI<tspan class="blink">_</tspan></text>
<text x="64" y="232" class="tag">CYBERSECURITY  •  AI / ML  •  AUTOMATION  •  SOFTWARE ENGINEERING</text>
</g>
<rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="#22d3ee" stroke-opacity=".5">
<animate attributeName="stroke-opacity" values=".15;.7;.15" dur="3s" repeatCount="indefinite"/></rect>
</svg>

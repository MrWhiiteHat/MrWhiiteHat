<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#0b1730"/><stop offset="1" stop-color="#083344"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#ffffff"/><stop offset=".66" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="5s" repeatCount="indefinite"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".08"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect width="1000" height="300" rx="18"/></clipPath>
</defs>
<style>
.p{animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.7}100%{transform:translateY(-230px);opacity:0}}
.t{font:800 74px 'Segoe UI',Arial,sans-serif;letter-spacing:2px}
.s{font:500 22px 'Courier New',monospace;fill:#67e8f9;letter-spacing:3px}
.tag{font:600 14px 'Courier New',monospace;fill:#94a3b8;letter-spacing:2px}
.ring{transform-origin:850px 150px;animation:spin 18s linear infinite}
.ring2{transform-origin:850px 150px;animation:spin 11s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-origin:850px 150px}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.blink{animation:bk 1s steps(2) infinite}@keyframes bk{50%{opacity:0}}
</style>
<g clip-path="url(#r)">
<rect width="1000" height="300" fill="url(#bg)"/><rect width="1000" height="300" fill="url(#grid)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" aria-label="Holographic Wireframe Globe">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Gradients -->
    <radialGradient id="holoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.10" />
      <stop offset="45%" stop-color="#00e5ff" stop-opacity="0.05" />
      <stop offset="80%" stop-color="#7c4dff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreLight" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#00bcd4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes floatGlobe {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseA {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes pulseB {
        0%, 100% { opacity: 0.9; transform: scale(1.2); }
        50% { opacity: 0.3; transform: scale(0.9); }
      }
      @keyframes pulseC {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }
      @keyframes driftP1 {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(4px, -7px); opacity: 0.9; }
      }
      @keyframes driftP2 {
        0%, 100% { transform: translate(0, 0); opacity: 0.8; }
        50% { transform: translate(-6px, 5px); opacity: 0.25; }
      }
      @keyframes driftP3 {
        0%, 100% { transform: translate(0, 0); opacity: 0.4; }
        50% { transform: translate(5px, 6px); opacity: 0.95; }
      }
      @keyframes driftP4 {
        0%, 100% { transform: translate(0, 0); opacity: 0.7; }
        50% { transform: translate(-5px, -6px); opacity: 0.2; }
      }

      .floating-container {
        animation: floatGlobe 6s ease-in-out infinite;
      }
      .node-pulse-1 { animation: pulseA 2.4s ease-in-out infinite; transform-origin: center; }
      .node-pulse-2 { animation: pulseB 3.1s ease-in-out infinite; transform-origin: center; }
      .node-pulse-3 { animation: pulseC 2.8s ease-in-out infinite; }

      .p-drift-1 { animation: driftP1 5.2s ease-in-out infinite; }
      .p-drift-2 { animation: driftP2 6.4s ease-in-out infinite; }
      .p-drift-3 { animation: driftP3 4.8s ease-in-out infinite; }
      .p-drift-4 { animation: driftP4 7.0s ease-in-out infinite; }
    </style>
  </defs>

  <!-- BACKGROUND SUBTLE RADIAL GLOW -->
  <circle cx="200" cy="200" r="175" fill="url(#holoGlow)" />
  <circle cx="200" cy="200" r="120" fill="url(#coreLight)" />

  <!-- FLOATING CONTAINER FOR ENTIRE HOLOGRAPHIC RIG -->
  <g class="floating-container">

    <!-- SUBTLE OUTER DATA CALIBRATION RING (SLOW REVERSE ROTATION) -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 200 200"
        to="0 200 200"
        dur="60s"
        repeatCount="indefinite"
      />
      <circle
        cx="200"
        cy="200"
        r="142"
        fill="none"
        stroke="#00e5ff"
        stroke-width="0.75"
        stroke-dasharray="2 24 1 12 3 36"
        opacity="0.22"
      />
      <!-- Outer Tech Tick Marks -->
      <line x1="200" y1="52" x2="200" y2="56" stroke="#00ff88" stroke-width="1.2" opacity="0.4" />
      <line x1="200" y1="344" x2="200" y2="348" stroke="#00ff88" stroke-width="1.2" opacity="0.4" />
      <line x1="52" y1="200" x2="56" y2="200" stroke="#00ff88" stroke-width="1.2" opacity="0.4" />
      <line x1="344" y1="200" x2="348" y2="200" stroke="#00ff88" stroke-width="1.2" opacity="0.4" />
    </g>

    <!-- INCLINED ORBITAL RING (rx=160, ry=40, stroke #7c4dff, slowly rotating over 20s) -->
    <g transform="rotate(-22 200 200)">
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 200 200"
          to="360 200 200"
          dur="20s"
          repeatCount="indefinite"
        />
        <ellipse
          cx="200"
          cy="200"
          rx="160"
          ry="40"
          fill="none"
          stroke="#7c4dff"
          stroke-width="1.2"
          stroke-dasharray="4 8"
          opacity="0.32"
          filter="url(#glow-violet)"
        />
        <!-- Orbital Satellites / Nodes -->
        <circle cx="360" cy="200" r="3" fill="#b388ff" filter="url(#glow-violet)">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
        </circle>
        <circle cx="40" cy="200" r="2.5" fill="#00e5ff" filter="url(#glow-cyan)">
          <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <!-- Orbital Target Crosshair -->
        <line x1="360" y1="194" x2="360" y2="206" stroke="#e6edf3" stroke-width="0.75" opacity="0.6" />
        <line x1="354" y1="200" x2="366" y2="200" stroke="#e6edf3" stroke-width="0.75" opacity="0.6" />
      </g>
    </g>

    <!-- MAIN ROTATING GLOBE GROUP (0-360deg over 30s) -->
    <g id="globe-system">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 200 200"
        to="360 200 200"
        dur="30s"
        repeatCount="indefinite"
      />

      <!-- WIREFRAME SPHERE: MAIN BOUNDARY CIRCLE (r=120, stroke #00ff88, opacity 0.4) -->
      <circle
        cx="200"
        cy="200"
        r="120"
        fill="none"
        stroke="#00ff88"
        stroke-width="1.5"
        opacity="0.4"
        filter="url(#glow-green)"
      />
      <circle
        cx="200"
        cy="200"
        r="120"
        fill="none"
        stroke="#00e5ff"
        stroke-width="0.75"
        stroke-dasharray="3 6"
        opacity="0.25"
      />

      <!-- 3 VERTICAL ELLIPSES ROTATED AT 0°, 60°, 120° (simulate longitude lines) -->
      <!-- Longitude Set 1: Rotation 0° -->
      <g>
        <ellipse
          cx="200"
          cy="200"
          rx="50"
          ry="120"
          fill="none"
          stroke="#00ff88"
          stroke-width="1.1"
          opacity="0.28"
        />
        <ellipse
          cx="200"
          cy="200"
          rx="90"
          ry="120"
          fill="none"
          stroke="#00ff88"
          stroke-width="0.9"
          opacity="0.20"
        />
        <line
          x1="200"
          y1="80"
          x2="200"
          y2="320"
          stroke="#00ff88"
          stroke-width="0.8"
          stroke-dasharray="3 4"
          opacity="0.22"
        />
      </g>

      <!-- Longitude Set 2: Rotation 60° -->
      <g transform="rotate(60 200 200)">
        <ellipse
          cx="200"
          cy="200"
          rx="50"
          ry="120"
          fill="none"
          stroke="#00ff88"
          stroke-width="1.1"
          opacity="0.26"
        />
        <ellipse
          cx="200"
          cy="200"
          rx="90"
          ry="120"
          fill="none"
          stroke="#00ff88"
          stroke-width="0.9"
          opacity="0.18"
        />
        <line
          x1="200"
          y1="80"
          x2="200"
          y2="320"
          stroke="#00ff88"
          stroke-width="0.8"
          stroke-dasharray="3 4"
          opacity="0.20"
        />
      </g>

      <!-- Longitude Set 3: Rotation 120° -->
      <g transform="rotate(120 200 200)">
        <ellipse
          cx="200"
          cy="200"
          rx="50"
          ry="120"
          fill="none"
          stroke="#00ff88"
          stroke-width="1.1"
          opacity="0.26"
        />
        <ellipse
          cx="200"
          cy="200"
          rx="90"
          ry="120"
          fill="none"
          stroke="#00ff88"
          stroke-width="0.9"
          opacity="0.18"
        />
        <line
          x1="200"
          y1="80"
          x2="200"
          y2="320"
          stroke="#00ff88"
          stroke-width="0.8"
          stroke-dasharray="3 4"
          opacity="0.20"
        />
      </g>

      <!-- HORIZONTAL ELLIPSES FOR LATITUDE LINES (stroke #00e5ff, opacity 0.15-0.25) -->
      <!-- Equator -->
      <ellipse
        cx="200"
        cy="200"
        rx="120"
        ry="28"
        fill="none"
        stroke="#00e5ff"
        stroke-width="1.2"
        opacity="0.28"
      />
      <!-- North Latitude Lines -->
      <ellipse
        cx="200"
        cy="165"
        rx="114"
        ry="23"
        fill="none"
        stroke="#00e5ff"
        stroke-width="0.9"
        opacity="0.22"
      />
      <ellipse
        cx="200"
        cy="135"
        rx="98"
        ry="18"
        fill="none"
        stroke="#00e5ff"
        stroke-width="0.8"
        opacity="0.18"
      />
      <ellipse
        cx="200"
        cy="105"
        rx="67"
        ry="12"
        fill="none"
        stroke="#00e5ff"
        stroke-width="0.75"
        opacity="0.14"
      />

      <!-- South Latitude Lines -->
      <ellipse
        cx="200"
        cy="235"
        rx="114"
        ry="23"
        fill="none"
        stroke="#00e5ff"
        stroke-width="0.9"
        opacity="0.22"
      />
      <ellipse
        cx="200"
        cy="265"
        rx="98"
        ry="18"
        fill="none"
        stroke="#00e5ff"
        stroke-width="0.8"
        opacity="0.18"
      />
      <ellipse
        cx="200"
        cy="295"
        rx="67"
        ry="12"
        fill="none"
        stroke="#00e5ff"
        stroke-width="0.75"
        opacity="0.14"
      />

      <!-- NETWORK CONNECTION LINES BETWEEN NODES (stroke-width 0.5, #00e5ff, opacity 0.2) -->
      <g stroke="#00e5ff" stroke-width="0.6" opacity="0.24">
        <!-- Northern polar network web -->
        <line x1="200" y1="80" x2="148" y2="165" />
        <line x1="200" y1="80" x2="252" y2="165" />
        <line x1="200" y1="80" x2="200" y2="165" />
        <!-- Equator network band -->
        <line x1="148" y1="165" x2="200" y2="200" />
        <line x1="252" y1="165" x2="200" y2="200" />
        <line x1="80" y1="200" x2="148" y2="165" />
        <line x1="320" y1="200" x2="252" y2="165" />
        <line x1="148" y1="165" x2="252" y2="165" stroke-dasharray="3 3" />
        <!-- Southern polar network web -->
        <line x1="200" y1="200" x2="148" y2="235" />
        <line x1="200" y1="200" x2="252" y2="235" />
        <line x1="80" y1="200" x2="148" y2="235" />
        <line x1="320" y1="200" x2="252" y2="235" />
        <line x1="148" y1="235" x2="200" y2="320" />
        <line x1="252" y1="235" x2="200" y2="320" />
        <line x1="200" y1="235" x2="200" y2="320" />
        <line x1="148" y1="235" x2="252" y2="235" stroke-dasharray="3 3" />
        <!-- Cross-hemisphere diagonal link -->
        <line x1="148" y1="165" x2="252" y2="235" stroke="#00ff88" stroke-dasharray="2 3" opacity="0.3" />
      </g>

      <!-- GLOWING NODES AT INTERSECTIONS (r=2-3, fill #00ff88, glow filter) -->
      <!-- Node 1: North Pole -->
      <g>
        <circle cx="200" cy="80" r="3" fill="#00ff88" filter="url(#glow-green)">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
        </circle>
        <circle cx="200" cy="80" r="1.3" fill="#ffffff" />
      </g>

      <!-- Node 2: South Pole -->
      <g>
        <circle cx="200" cy="320" r="3" fill="#00ff88" filter="url(#glow-green)">
          <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.7s" repeatCount="indefinite" />
        </circle>
        <circle cx="200" cy="320" r="1.3" fill="#ffffff" />
      </g>

      <!-- Node 3: West Equator -->
      <g>
        <circle cx="80" cy="200" r="2.8" fill="#00ff88" filter="url(#glow-green)">
          <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="80" cy="200" r="1.2" fill="#ffffff" />
      </g>

      <!-- Node 4: East Equator -->
      <g>
        <circle cx="320" cy="200" r="2.8" fill="#00ff88" filter="url(#glow-green)">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="2.9s" repeatCount="indefinite" />
        </circle>
        <circle cx="320" cy="200" r="1.2" fill="#ffffff" />
      </g>

      <!-- Node 5: Center Core Nexus -->
      <g>
        <circle cx="200" cy="200" r="3.2" fill="#00e5ff" filter="url(#glow-cyan)">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite" />
        </circle>
        <circle cx="200" cy="200" r="1.5" fill="#ffffff" />
      </g>

      <!-- Node 6: North-West Intersection -->
      <g>
        <circle cx="148" cy="165" r="2.5" fill="#00ff88" filter="url(#glow-green)">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
        </circle>
        <circle cx="148" cy="165" r="1" fill="#ffffff" />
      </g>

      <!-- Node 7: North-East Intersection -->
      <g>
        <circle cx="252" cy="165" r="2.5" fill="#00ff88" filter="url(#glow-green)">
          <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite" />
        </circle>
        <circle cx="252" cy="165" r="1" fill="#ffffff" />
      </g>

      <!-- Node 8: South-West Intersection -->
      <g>
        <circle cx="148" cy="235" r="2.5" fill="#00ff88" filter="url(#glow-green)">
          <animate attributeName="opacity" values="0.3;0.85;0.3" dur="3.0s" repeatCount="indefinite" />
        </circle>
        <circle cx="148" cy="235" r="1" fill="#ffffff" />
      </g>

      <!-- Node 9: South-East Intersection -->
      <g>
        <circle cx="252" cy="235" r="2.5" fill="#00ff88" filter="url(#glow-green)">
          <animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.1s" repeatCount="indefinite" />
        </circle>
        <circle cx="252" cy="235" r="1" fill="#ffffff" />
      </g>

      <!-- Node 10: North Meridian Crossing -->
      <g>
        <circle cx="200" cy="135" r="2.2" fill="#00e5ff" filter="url(#glow-cyan)">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite" />
        </circle>
      </g>

      <!-- Node 11: South Meridian Crossing -->
      <g>
        <circle cx="200" cy="265" r="2.2" fill="#00e5ff" filter="url(#glow-cyan)">
          <animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>

    <!-- FLOATING PARTICLE FIELD (6-8 tiny dots r=1 with individual float animations) -->
    <g id="particle-field">
      <!-- Particle 1: Top-Left -->
      <g class="p-drift-1">
        <circle cx="58" cy="105" r="1.2" fill="#00ff88" opacity="0.6" filter="url(#glow-green)" />
      </g>
      <!-- Particle 2: Top-Right -->
      <g class="p-drift-2">
        <circle cx="338" cy="88" r="1.2" fill="#00e5ff" opacity="0.75" filter="url(#glow-cyan)" />
      </g>
      <!-- Particle 3: Bottom-Left -->
      <g class="p-drift-3">
        <circle cx="68" cy="305" r="1.1" fill="#b388ff" opacity="0.7" filter="url(#glow-violet)" />
      </g>
      <!-- Particle 4: Bottom-Right -->
      <g class="p-drift-4">
        <circle cx="342" cy="312" r="1.3" fill="#00ff88" opacity="0.65" filter="url(#glow-green)" />
      </g>
      <!-- Particle 5: Far-Left Mid -->
      <g class="p-drift-2">
        <circle cx="32" cy="195" r="1" fill="#00e5ff" opacity="0.5" />
      </g>
      <!-- Particle 6: Far-Right Mid -->
      <g class="p-drift-1">
        <circle cx="372" cy="182" r="1.1" fill="#b388ff" opacity="0.6" />
      </g>
      <!-- Particle 7: Top High-Orbit -->
      <g class="p-drift-4">
        <circle cx="120" cy="48" r="1.2" fill="#00ff88" opacity="0.7" />
      </g>
      <!-- Particle 8: Bottom Low-Orbit -->
      <g class="p-drift-3">
        <circle cx="295" cy="358" r="1" fill="#00e5ff" opacity="0.6" />
      </g>
    </g>

    <!-- CORNER HUD TECH ACCENTS (Subtle Cyberpunk Framework) -->
    <g stroke="#00ff88" stroke-width="1" opacity="0.3" fill="none">
      <path d="M 18 30 L 18 18 L 30 18" />
      <path d="M 382 30 L 382 18 L 370 18" />
      <path d="M 18 370 L 18 382 L 30 382" />
      <path d="M 382 370 L 382 382 L 370 382" />
    </g>

    <!-- STATUS TELEMETRY LABELS (Monospace) -->
    <text
      x="24"
      y="380"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="8"
      fill="#8b949e"
      opacity="0.6"
      letter-spacing="1"
    >SYS.GEO//HOLO-01</text>
    <text
      x="376"
      y="380"
      text-anchor="end"
      font-family="'Consolas', 'Courier New', monospace"
      font-size="8"
      fill="#00ff88"
      opacity="0.6"
      letter-spacing="1"
    >ONLINE [30s/ROT]</text>
  </g>
</svg>

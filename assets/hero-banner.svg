<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280">
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="subtleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e0a"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes fadeRole1 { 0%,22%{opacity:1} 25%,100%{opacity:0} }
    @keyframes fadeRole2 { 0%,24%{opacity:0} 25%,47%{opacity:1} 50%,100%{opacity:0} }
    @keyframes fadeRole3 { 0%,49%{opacity:0} 50%,72%{opacity:1} 75%,100%{opacity:0} }
    @keyframes fadeRole4 { 0%,74%{opacity:0} 75%,97%{opacity:1} 100%{opacity:0} }
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  </style>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#subtleBg)" rx="12"/>

  <!-- Subtle center glow -->
  <ellipse cx="450" cy="130" rx="250" ry="100" fill="#00ff88" opacity="0.03" filter="url(#softglow)"/>

  <!-- Thin border -->
  <rect x="1" y="1" width="898" height="278" rx="12" fill="none" stroke="#00ff88" stroke-opacity="0.12"/>

  <!-- Minimal corner accents -->
  <path d="M20,12 L20,25" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M12,20 L25,20" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M880,12 L880,25" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M875,20 L888,20" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M20,268 L20,255" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M12,260 L25,260" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M880,268 L880,255" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M875,260 L888,260" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Main name -->
  <text x="450" y="105" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="46" font-weight="bold" fill="#e6edf3" letter-spacing="12" filter="url(#glow)">MRWHITEHAT</text>

  <!-- Accent line under name -->
  <line x1="250" y1="125" x2="650" y2="125" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Cycling roles -->
  <text x="450" y="158" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="14" fill="#00ff88" opacity="0" style="animation:fadeRole1 12s infinite">AI Systems Developer</text>
  <text x="450" y="158" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="14" fill="#00ff88" opacity="0" style="animation:fadeRole2 12s infinite">Security Researcher</text>
  <text x="450" y="158" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="14" fill="#00e5ff" opacity="0" style="animation:fadeRole3 12s infinite">Full-Stack Engineer</text>
  <text x="450" y="158" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="14" fill="#b388ff" opacity="0" style="animation:fadeRole4 12s infinite">Autonomous Agent Builder</text>

  <!-- Blinking cursor -->
  <rect x="575" y="146" width="2" height="14" fill="#00ff88" style="animation:blink 1s step-end infinite"/>

  <!-- Bottom info line -->
  <text x="450" y="210" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="11" fill="#8b949e">Odisha, India  ·  B.Tech CSE  ·  Building Intelligent Systems</text>

  <!-- Subtle decorative dots -->
  <circle cx="350" cy="240" r="1.5" fill="#00ff88" opacity="0.2" style="animation:pulse 3s infinite"/>
  <circle cx="450" cy="240" r="1.5" fill="#00e5ff" opacity="0.2" style="animation:pulse 3s 1s infinite"/>
  <circle cx="550" cy="240" r="1.5" fill="#7c4dff" opacity="0.2" style="animation:pulse 3s 2s infinite"/>
</svg>

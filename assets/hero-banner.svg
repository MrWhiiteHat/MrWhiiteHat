<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <!-- Background radial glow -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0a1a0a" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#0a0a0a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>

    <!-- Holographic grid pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff88" stroke-width="0.7" stroke-opacity="0.06"/>
    </pattern>

    <!-- Glow filter for main title -->
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for emblem and accents -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline tail gradient -->
    <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="75%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Energy line gradients from emblem -->
    <linearGradient id="energyLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="energyCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="energyRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    /* Base typography */
    text {
      font-family: 'Consolas', 'Courier New', monospace;
      user-select: none;
    }

    /* Floating particles animations */
    @keyframes float1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes float2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(22px); } }
    @keyframes float3 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }
    @keyframes float4 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(18px); } }
    @keyframes float5 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    @keyframes float6 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(28px); } }

    .p1 { animation: float1 4.5s ease-in-out infinite; opacity: 0.45; }
    .p2 { animation: float2 6.2s ease-in-out infinite; opacity: 0.35; animation-delay: -1.2s; }
    .p3 { animation: float3 5.5s ease-in-out infinite; opacity: 0.55; animation-delay: -2.8s; }
    .p4 { animation: float4 7.0s ease-in-out infinite; opacity: 0.4; animation-delay: -1.9s; }
    .p5 { animation: float5 3.9s ease-in-out infinite; opacity: 0.6; animation-delay: -0.6s; }
    .p6 { animation: float6 8.0s ease-in-out infinite; opacity: 0.3; animation-delay: -4.1s; }

    /* Geometric rotations */
    @keyframes rotateClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .rot-hex { animation: rotateClockwise 30s linear infinite; }
    .rot-reticle { animation: rotateCounter 25s linear infinite; }
    .rot-emblem-ring { animation: rotateClockwise 18s linear infinite; }

    /* Energy lines pulsing */
    @keyframes pulseEnergy {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.75; }
    }
    .energy-pulse { animation: pulseEnergy 3s ease-in-out infinite; }

    /* Scanning line animation */
    @keyframes scan {
      0% { transform: translateY(-10px); opacity: 0; }
      4% { opacity: 0.4; }
      96% { opacity: 0.4; }
      100% { transform: translateY(410px); opacity: 0; }
    }
    .scan-line { animation: scan 4.5s linear infinite; }

    /* Cursor blink animation */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-box {
      animation: blink 1s infinite steps(1);
    }

    /* Subtitle roles cycling (12s total cycle, 3s each) */
    @keyframes role1 {
      0% { opacity: 0; }
      1%, 24% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
    @keyframes role2 {
      0%, 24.9% { opacity: 0; }
      25%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes role3 {
      0%, 49.9% { opacity: 0; }
      50%, 74% { opacity: 1; }
      75%, 100% { opacity: 0; }
    }
    @keyframes role4 {
      0%, 74.9% { opacity: 0; }
      75%, 99% { opacity: 1; }
      100% { opacity: 0; }
    }

    .role-group-1 { animation: role1 12s infinite; }
    .role-group-2 { animation: role2 12s infinite; }
    .role-group-3 { animation: role3 12s infinite; }
    .role-group-4 { animation: role4 12s infinite; }

    /* Status dot pulse */
    @keyframes dotPulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .status-dot {
      transform-origin: 154px 376px;
      animation: dotPulse 2s ease-in-out infinite;
    }
  </style>

  <!-- 1. BACKGROUND -->
  <rect width="900" height="400" fill="#0a0a0a"/>
  <rect width="900" height="400" fill="url(#bgGlow)"/>
  <rect width="900" height="400" fill="url(#cyberGrid)"/>

  <!-- 4. GEOMETRIC WIREFRAME ELEMENTS (Background layers) -->
  <!-- Diagonal accent lines -->
  <line x1="40" y1="20" x2="280" y2="260" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.08" stroke-dasharray="6,8"/>
  <line x1="860" y1="20" x2="620" y2="260" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.08" stroke-dasharray="6,8"/>
  <line x1="70" y1="360" x2="210" y2="220" stroke="#7c4dff" stroke-width="0.6" stroke-opacity="0.08" stroke-dasharray="4,6"/>
  <line x1="830" y1="360" x2="690" y2="220" stroke="#7c4dff" stroke-width="0.6" stroke-opacity="0.08" stroke-dasharray="4,6"/>

  <!-- Left rotating hexagon -->
  <g transform="translate(100, 95)">
    <g class="rot-hex">
      <polygon points="32,0 16,27.71 -16,27.71 -32,0 -16,-27.71 16,-27.71" fill="none" stroke="#00ff88" stroke-width="1.2" stroke-opacity="0.15"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00ff88" stroke-width="0.8" stroke-dasharray="3,5" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="2.5" fill="#00ff88" opacity="0.25"/>
    </g>
  </g>

  <!-- Right rotating reticle/diamond -->
  <g transform="translate(800, 95)">
    <g class="rot-reticle">
      <polygon points="26,0 0,26 -26,0 0,-26" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.18"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#7c4dff" stroke-width="0.8" stroke-dasharray="5,7" stroke-opacity="0.15"/>
      <circle cx="0" cy="0" r="2.5" fill="#00e5ff" opacity="0.25"/>
    </g>
  </g>

  <!-- Accent diamonds -->
  <polygon points="190,75 195,80 190,85 185,80" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3"/>
  <polygon points="710,75 715,80 710,85 705,80" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>
  <polygon points="215,315 220,320 215,325 210,320" fill="none" stroke="#7c4dff" stroke-width="1" stroke-opacity="0.3"/>
  <polygon points="685,315 690,320 685,325 680,320" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Telemetry code accents -->
  <text x="32" y="195" font-size="8" fill="#00ff88" opacity="0.22" letter-spacing="1">0x7F_INIT<tspan x="32" dy="13">0x9A_EXEC</tspan><tspan x="32" dy="13">0xB4_SYNC</tspan><tspan x="32" dy="13">0xEE_PASS</tspan></text>
  <text x="868" y="195" text-anchor="end" font-size="8" fill="#00e5ff" opacity="0.22" letter-spacing="1">ARCH_64<tspan x="868" dy="13">NODE_SEC</tspan><tspan x="868" dy="13">AUTH_ACK</tspan><tspan x="868" dy="13">PORT_80</tspan></text>

  <!-- 3. FLOATING PARTICLES (18 particles) -->
  <circle cx="80" cy="180" r="1.5" fill="#00ff88" class="p1"/>
  <circle cx="140" cy="270" r="1.2" fill="#00e5ff" class="p2"/>
  <circle cx="210" cy="95" r="2" fill="#00ff88" class="p3"/>
  <circle cx="260" cy="325" r="1.5" fill="#00e5ff" class="p4"/>
  <circle cx="330" cy="70" r="1.2" fill="#00ff88" class="p5"/>
  <circle cx="390" cy="155" r="1.8" fill="#00e5ff" class="p6"/>
  <circle cx="510" cy="150" r="1.4" fill="#00ff88" class="p1"/>
  <circle cx="575" cy="80" r="1.8" fill="#00e5ff" class="p2"/>
  <circle cx="640" cy="315" r="1.3" fill="#00ff88" class="p3"/>
  <circle cx="715" cy="105" r="1.6" fill="#00e5ff" class="p4"/>
  <circle cx="780" cy="245" r="2" fill="#00ff88" class="p5"/>
  <circle cx="830" cy="165" r="1.3" fill="#00e5ff" class="p6"/>
  <circle cx="170" cy="140" r="1.2" fill="#7c4dff" class="p3"/>
  <circle cx="735" cy="190" r="1.5" fill="#7c4dff" class="p1"/>
  <circle cx="290" cy="280" r="1.5" fill="#00ff88" class="p2"/>
  <circle cx="615" cy="265" r="1.2" fill="#00e5ff" class="p5"/>
  <circle cx="470" cy="335" r="1.6" fill="#00ff88" class="p4"/>
  <circle cx="120" cy="340" r="1.3" fill="#00e5ff" class="p6"/>

  <!-- 10. ENERGY LINES (Emanating downward from emblem) -->
  <g class="energy-pulse">
    <!-- Left ray -->
    <line x1="438" y1="74" x2="310" y2="135" stroke="url(#energyLeft)" stroke-width="1.4" stroke-dasharray="3,3"/>
    <!-- Center ray -->
    <line x1="450" y1="78" x2="450" y2="132" stroke="url(#energyCenter)" stroke-width="1.6"/>
    <!-- Right ray -->
    <line x1="462" y1="74" x2="590" y2="135" stroke="url(#energyRight)" stroke-width="1.4" stroke-dasharray="3,3"/>
  </g>

  <!-- 9. EMBLEM (Top-Center, y ~30-50, geometric shield & 'W') -->
  <g id="emblem-group">
    <!-- Outer rotating dashed ring -->
    <g transform="translate(450, 52)">
      <circle cx="0" cy="0" r="27" fill="none" stroke="#00ff88" stroke-width="0.8" stroke-dasharray="7 14" stroke-opacity="0.35" class="rot-emblem-ring"/>
    </g>

    <!-- Shield outline -->
    <path d="M 450,28 L 472,37 L 472,56 C 472,69 450,78 450,78 C 450,78 428,69 428,56 L 428,37 Z" 
          fill="#0d1117" fill-opacity="0.85" stroke="#00ff88" stroke-width="1.5" stroke-linejoin="round" filter="url(#softGlow)"/>

    <!-- Inner visor cross-line -->
    <line x1="434" y1="45" x2="466" y2="45" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Stylized geometric 'W' -->
    <path d="M 436,49 L 442,66 L 450,56 L 458,66 L 464,49" 
          fill="none" stroke="#00ff88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Core glowing diamond -->
    <polygon points="450,33 453,38 450,43 447,38" fill="#00ff88" filter="url(#softGlow)"/>
  </g>

  <!-- 5. MAIN TITLE -->
  <g id="main-title">
    <!-- Sub-header tag -->
    <text x="450" y="112" text-anchor="middle" font-size="11" letter-spacing="4" fill="#00e5ff" opacity="0.85" font-weight="bold">// SYSTEM IDENTITY //</text>
    
    <!-- Title: MRWHITEHAT -->
    <text x="450" y="160" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="10" fill="#e6edf3" filter="url(#glow)">MRWHITEHAT</text>
  </g>

  <!-- 6. SUBTITLE WITH TYPING ANIMATION (Stacked roles & blinking cursor) -->
  <g id="subtitle-terminal">
    <!-- Terminal pill background -->
    <rect x="235" y="196" width="430" height="38" rx="6" fill="#0d1117" stroke="#00ff88" stroke-width="1.2" stroke-opacity="0.32"/>
    
    <!-- Console dots on the left -->
    <circle cx="253" cy="215" r="3" fill="#ff5f56" opacity="0.6"/>
    <circle cx="263" cy="215" r="3" fill="#ffbd2e" opacity="0.6"/>
    <circle cx="273" cy="215" r="3" fill="#00e676" opacity="0.6"/>

    <!-- Role 1: > AI Systems Developer -->
    <g class="role-group-1">
      <text x="290" y="221" font-size="15" fill="#00ff88" font-weight="600">&gt; AI Systems Developer</text>
      <!-- Blinking cursor at x = 290 + 22 * 9.0 = 488 -->
      <rect x="492" y="207" width="8" height="17" rx="1" fill="#00ff88" class="cursor-box"/>
    </g>

    <!-- Role 2: > Security Researcher -->
    <g class="role-group-2">
      <text x="290" y="221" font-size="15" fill="#00ff88" font-weight="600">&gt; Security Researcher</text>
      <!-- Blinking cursor at x = 290 + 21 * 9.0 = 479 -->
      <rect x="483" y="207" width="8" height="17" rx="1" fill="#00ff88" class="cursor-box"/>
    </g>

    <!-- Role 3: > Full-Stack Engineer -->
    <g class="role-group-3">
      <text x="290" y="221" font-size="15" fill="#00ff88" font-weight="600">&gt; Full-Stack Engineer</text>
      <!-- Blinking cursor at x = 290 + 21 * 9.0 = 479 -->
      <rect x="483" y="207" width="8" height="17" rx="1" fill="#00ff88" class="cursor-box"/>
    </g>

    <!-- Role 4: > Autonomous Agent Builder -->
    <g class="role-group-4">
      <text x="290" y="221" font-size="15" fill="#00ff88" font-weight="600">&gt; Autonomous Agent Builder</text>
      <!-- Blinking cursor at x = 290 + 26 * 9.0 = 524 -->
      <rect x="528" y="207" width="8" height="17" rx="1" fill="#00ff88" class="cursor-box"/>
    </g>
  </g>

  <!-- Cyber capability badges between subtitle and status bar -->
  <g transform="translate(450, 268)">
    <!-- Badge 1 -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="120" height="22" rx="3" fill="#161b22" stroke="#7c4dff" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="60" y="15" text-anchor="middle" font-size="9" fill="#b388ff" letter-spacing="1">AGENTIC_AI</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(-60, 0)">
      <rect x="0" y="0" width="120" height="22" rx="3" fill="#161b22" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="60" y="15" text-anchor="middle" font-size="9" fill="#00e5ff" letter-spacing="1">DEV_SECURITY</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(75, 0)">
      <rect x="0" y="0" width="120" height="22" rx="3" fill="#161b22" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="60" y="15" text-anchor="middle" font-size="9" fill="#00ff88" letter-spacing="1">FULL_STACK</text>
    </g>
  </g>

  <!-- 2. DECORATIVE FRAME & CORNER RETICLES -->
  <!-- Outer bounding frame -->
  <rect x="15" y="15" width="870" height="370" rx="4" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Corner targeting reticles (L-shaped lines) -->
  <path d="M 10,28 L 10,10 L 28,10" fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="square"/>
  <path d="M 872,10 L 890,10 L 890,28" fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="square"/>
  <path d="M 10,372 L 10,390 L 28,390" fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="square"/>
  <path d="M 872,390 L 890,390 L 890,372" fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="square"/>

  <!-- Coordinate and system labels at corners -->
  <text x="32" y="32" font-size="9" fill="#8b949e" letter-spacing="1">[0x00_SYS]</text>
  <text x="868" y="32" text-anchor="end" font-size="9" fill="#8b949e" letter-spacing="1">[0xFF_SEC]</text>
  <text x="32" y="352" font-size="9" fill="#8b949e" letter-spacing="1">[NODE_01]</text>
  <text x="868" y="352" text-anchor="end" font-size="9" fill="#8b949e" letter-spacing="1">[AUTH_OK]</text>

  <!-- 7. SCANNING LINE -->
  <g class="scan-line">
    <rect x="15" y="-12" width="870" height="12" fill="url(#scanGradient)"/>
    <line x1="15" y1="0" x2="885" y2="0" stroke="#00ff88" stroke-width="1.2" opacity="0.45"/>
  </g>

  <!-- 8. STATUS BAR (y ~368, height ~22) -->
  <g id="status-bar">
    <rect x="20" y="365" width="860" height="22" rx="3" fill="#161b22" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.25"/>
    
    <!-- Left: SYS.STATUS: ONLINE -->
    <text x="36" y="380" font-size="10" fill="#8b949e">SYS.STATUS: <tspan fill="#00ff88" font-weight="bold">ONLINE</tspan></text>
    <circle cx="154" cy="376" r="3.2" fill="#00ff88" class="status-dot"/>

    <!-- Center: LOCATION: ODISHA.IN -->
    <text x="450" y="380" text-anchor="middle" font-size="10" fill="#8b949e">LOCATION: <tspan fill="#e6edf3" font-weight="600">ODISHA.IN</tspan></text>

    <!-- Right: FOCUS: AI + SECURITY -->
    <text x="864" y="380" text-anchor="end" font-size="10" fill="#8b949e">FOCUS: <tspan fill="#00e5ff" font-weight="600">AI + SECURITY</tspan></text>
  </g>
</svg>

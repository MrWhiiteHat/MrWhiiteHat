<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300">
  <defs>
    <!-- Top accent stripe gradient: #00e5ff through #00ff88 to #7c4dff -->
    <linearGradient id="aegisTopStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>

    <!-- Radial ambient glow behind shield illustration -->
    <radialGradient id="aegisHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.2" />
      <stop offset="65%" stop-color="#00ff88" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="aegisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card clipping path -->
    <clipPath id="aegisCardClip">
      <rect x="0" y="0" width="850" height="300" rx="8" />
    </clipPath>

    <!-- Sci-Fi background grid -->
    <pattern id="aegisGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161b22" stroke-width="0.8" opacity="0.65" />
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: 'Consolas', 'Courier New', monospace;
    }

    .animated-border {
      stroke-dasharray: 8 4;
      animation: borderFlowAegis 3s linear infinite;
    }

    @keyframes borderFlowAegis {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 24; }
    }

    .pulse-anim {
      animation: pulseAegis 2.8s ease-in-out infinite alternate;
    }

    @keyframes pulseAegis {
      0% { opacity: 0.8; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    .status-pulse {
      animation: statusBlinkAegis 1.8s ease-in-out infinite alternate;
    }

    @keyframes statusBlinkAegis {
      0% { opacity: 0.45; }
      100% { opacity: 1; }
    }
  </style>

  <!-- 1. Background rounded rect -->
  <rect x="0.5" y="0.5" width="849" height="299" rx="8" fill="#0d1117" stroke="#1a1a2e" stroke-width="1" />

  <!-- Sci-fi background grid texture -->
  <rect x="0" y="0" width="850" height="300" rx="8" fill="url(#aegisGrid)" clip-path="url(#aegisCardClip)" />

  <!-- Futuristic HUD corner brackets -->
  <path d="M 12,24 L 12,12 L 24,12" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.4" />
  <path d="M 838,24 L 838,12 L 826,12" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.4" />
  <path d="M 12,276 L 12,288 L 24,288" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.4" />
  <path d="M 838,276 L 838,288 L 826,288" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.4" />

  <!-- 2. TOP STRIPE: 4px gradient bar across top edge -->
  <rect x="0" y="0" width="850" height="4" fill="url(#aegisTopStripe)" clip-path="url(#aegisCardClip)" />

  <!-- 3. LEFT SIDE ILLUSTRATION (x=30-100): Shield shape + Neural Network / Multi-Agent nodes -->
  <g class="pulse-anim" style="transform-origin: 66px 138px;">
    <!-- Radial halo glow -->
    <circle cx="66" cy="138" r="46" fill="url(#aegisHalo)" />

    <!-- Shield outer boundary (pentagon-like path, stroke #00e5ff) -->
    <path d="M 66,94 L 94,106 L 94,142 C 94,166 66,178 66,178 C 66,178 38,166 38,142 L 38,106 Z" fill="#161b22" stroke="#00e5ff" stroke-width="1.8" filter="url(#aegisGlow)" />

    <!-- Inner shield boundary -->
    <path d="M 66,101 L 88,111 L 88,140 C 88,159 66,170 66,170 C 66,170 44,159 44,140 L 44,111 Z" fill="#0a0a0a" stroke="#00bcd4" stroke-width="0.8" stroke-opacity="0.35" />

    <!-- Neural Network Synapse Lines -->
    <line x1="66" y1="134" x2="52" y2="118" stroke="#00e5ff" stroke-width="1.2" opacity="0.75" />
    <line x1="66" y1="134" x2="80" y2="118" stroke="#00e5ff" stroke-width="1.2" opacity="0.75" />
    <line x1="66" y1="134" x2="50" y2="150" stroke="#00e5ff" stroke-width="1.2" opacity="0.75" />
    <line x1="66" y1="134" x2="82" y2="150" stroke="#00e5ff" stroke-width="1.2" opacity="0.75" />
    <line x1="52" y1="118" x2="80" y2="118" stroke="#7c4dff" stroke-width="0.9" opacity="0.6" stroke-dasharray="2 1.5" />
    <line x1="50" y1="150" x2="82" y2="150" stroke="#00ff88" stroke-width="0.9" opacity="0.6" stroke-dasharray="2 1.5" />
    <line x1="52" y1="118" x2="50" y2="150" stroke="#00bcd4" stroke-width="0.8" opacity="0.45" />
    <line x1="80" y1="118" x2="82" y2="150" stroke="#00bcd4" stroke-width="0.8" opacity="0.45" />

    <!-- Neural Nodes (Multi-Agent Swarm) -->
    <!-- Peripheral Agent 1 (Top-Left) -->
    <circle cx="52" cy="118" r="3.2" fill="#7c4dff" stroke="#b388ff" stroke-width="0.8">
      <animate attributeName="r" values="3;4.2;3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Peripheral Agent 2 (Top-Right) -->
    <circle cx="80" cy="118" r="3.2" fill="#7c4dff" stroke="#b388ff" stroke-width="0.8">
      <animate attributeName="r" values="4.2;3;4.2" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Peripheral Agent 3 (Bottom-Left) -->
    <circle cx="50" cy="150" r="3.2" fill="#00ff88" stroke="#00ff88" stroke-width="0.8">
      <animate attributeName="r" values="3;4.2;3" dur="2.7s" repeatCount="indefinite" />
    </circle>

    <!-- Peripheral Agent 4 (Bottom-Right) -->
    <circle cx="82" cy="150" r="3.2" fill="#00ff88" stroke="#00ff88" stroke-width="0.8">
      <animate attributeName="r" values="4.2;3;4.2" dur="2.7s" repeatCount="indefinite" />
    </circle>

    <!-- Central Agent Core Node (Primary AI Controller) -->
    <circle cx="66" cy="134" r="5" fill="#00e5ff" stroke="#e6edf3" stroke-width="1.2">
      <animate attributeName="r" values="4.5;5.8;4.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="66" cy="134" r="9" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="2 1.5">
      <animate attributeName="stroke-dashoffset" from="0" to="12" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 4. MISSION LABEL (Top-Right Area): MISSION_02, CLASSIFIED: ACTIVE -->
  <g class="font-mono">
    <rect x="670" y="20" width="150" height="38" rx="4" fill="#161b22" stroke="#1f2937" stroke-width="1" />
    <circle cx="686" cy="39" r="3" fill="#00ff88" class="status-pulse">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="698" y="33" fill="#8b949e" font-size="10px" font-weight="600" letter-spacing="1.2px">MISSION_02</text>
    <text x="698" y="47" fill="#00ff88" font-size="9px" font-weight="700" letter-spacing="0.8px">CLASSIFIED: ACTIVE</text>
  </g>

  <!-- 5. PROJECT NAME: AegisAI in #e6edf3, font-size 22px -->
  <text x="130" y="70" class="font-mono" fill="#e6edf3" font-size="22px" font-weight="bold" letter-spacing="0.4px" filter="url(#aegisGlow)">AegisAI</text>

  <!-- 6. CODENAME: Below name, [AEGIS] in #00e5ff, font-size 14px -->
  <text x="130" y="93" class="font-mono" fill="#00e5ff" font-size="14px" font-weight="700" letter-spacing="1px">[AEGIS]</text>

  <!-- 7. DESCRIPTION (multi-line, font-size 12px, fill #8b949e, starting y~110, x~130) -->
  <g class="font-mono" font-size="12px" fill="#8b949e">
    <text x="130" y="118">AI-powered multi-agent content intelligence</text>
    <text x="130" y="136">and Discord moderation platform. Autonomous</text>
    <text x="130" y="154">agents for community safety and analysis.</text>
  </g>

  <!-- Sci-Fi Telemetry Panel (Right Side) -->
  <g class="font-mono" transform="translate(560, 72)">
    <rect x="0" y="0" width="260" height="98" rx="4" fill="#161b22" fill-opacity="0.65" stroke="#1f2937" stroke-width="1" />
    <rect x="0" y="0" width="260" height="20" rx="4" fill="#1a1a2e" fill-opacity="0.8" />
    <text x="10" y="14" fill="#8b949e" font-size="9px" font-weight="600" letter-spacing="0.8px">SYS.TELEMETRY // AEGIS-SWARM</text>
    
    <text x="10" y="38" fill="#8b949e" font-size="9px">SWARM CLUSTER: <tspan fill="#e6edf3">08 Neural Agents</tspan></text>
    <text x="10" y="54" fill="#8b949e" font-size="9px">INGEST LATENCY: <tspan fill="#00e5ff">12ms (Discord Shard)</tspan></text>
    <text x="10" y="70" fill="#8b949e" font-size="9px">NLP INFERENCE : <tspan fill="#e6edf3">Multi-Turn Intent</tspan></text>
    <text x="10" y="86" fill="#8b949e" font-size="9px">COMMUNITY DEF : <tspan fill="#00ff88" font-weight="bold">ACTIVE [99.8%]</tspan></text>
    
    <!-- Mini telemetry activity indicator -->
    <rect x="175" y="78" width="70" height="8" rx="2" fill="#0d1117" stroke="#1f2937" stroke-width="0.8" />
    <rect x="177" y="80" width="58" height="4" rx="1" fill="#00e5ff" opacity="0.85">
      <animate attributeName="width" values="58;44;64;52;58" dur="2.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 8. TECH TAGS (y~185, x~130): Python, Multi-Agent, Discord.py, LLM, NLP (strokes in cyan tones) -->
  <g class="font-mono" transform="translate(0, 185)">
    <!-- Badge 1: Python -->
    <rect x="130" y="0" width="56" height="22" rx="4" fill="#161b22" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" />
    <text x="158" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">Python</text>

    <!-- Badge 2: Multi-Agent -->
    <rect x="194" y="0" width="88" height="22" rx="4" fill="#161b22" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" />
    <text x="238" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">Multi-Agent</text>

    <!-- Badge 3: Discord.py -->
    <rect x="290" y="0" width="82" height="22" rx="4" fill="#161b22" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" />
    <text x="331" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">Discord.py</text>

    <!-- Badge 4: LLM -->
    <rect x="380" y="0" width="38" height="22" rx="4" fill="#161b22" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" />
    <text x="399" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">LLM</text>

    <!-- Badge 5: NLP -->
    <rect x="426" y="0" width="38" height="22" rx="4" fill="#161b22" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" />
    <text x="445" y="15" fill="#e6edf3" font-size="10px" text-anchor="middle">NLP</text>
  </g>

  <!-- 9. BOTTOM BAR (y~260-280): Bot icon + Content Intelligence on left. ● ACTIVE on right -->
  <!-- Separator line -->
  <line x1="30" y1="250" x2="820" y2="250" stroke="#161b22" stroke-width="1" />
  <line x1="130" y1="250" x2="220" y2="250" stroke="#00e5ff" stroke-width="1" opacity="0.6" />

  <g class="font-mono">
    <!-- Left: Bot icon (simple circle with antenna lines) + Content Intelligence -->
    <g transform="translate(130, 262)">
      <!-- Bot Head -->
      <rect x="0" y="4" width="16" height="12" rx="3" fill="none" stroke="#8b949e" stroke-width="1.2" />
      <!-- Antenna -->
      <line x1="8" y1="4" x2="8" y2="0" stroke="#8b949e" stroke-width="1.2" />
      <circle cx="8" cy="0" r="1.5" fill="#8b949e" />
      <!-- Eyes -->
      <circle cx="5" cy="10" r="1.2" fill="#8b949e" />
      <circle cx="11" cy="10" r="1.2" fill="#8b949e" />
      <!-- Ears -->
      <line x1="-2" y1="10" x2="0" y2="10" stroke="#8b949e" stroke-width="1.2" />
      <line x1="16" y1="10" x2="18" y2="10" stroke="#8b949e" stroke-width="1.2" />

      <text x="26" y="13" fill="#8b949e" font-size="10px">Content Intelligence</text>
    </g>

    <!-- Middle-left status metadata -->
    <g transform="translate(325, 264)">
      <text x="0" y="11" fill="#8b949e" opacity="0.5" font-size="9px">SHARD: US-EAST-01</text>
      <text x="135" y="11" fill="#8b949e" opacity="0.5" font-size="9px">TOPOLOGY: MESH</text>
    </g>

    <!-- Right: Status indicator showing ● ACTIVE in #00ff88 -->
    <g transform="translate(740, 264)">
      <circle cx="8" cy="8" r="6" fill="none" stroke="#00ff88" stroke-width="1">
        <animate attributeName="r" values="3;9" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="8" cy="8" r="3.5" fill="#00ff88">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="11" fill="#00ff88" font-size="10px" font-weight="700" letter-spacing="1px">ACTIVE</text>
    </g>
  </g>

  <!-- 10. ANIMATED BORDER: Dash animation with #00e5ff stroke (0 to 24 over 3s) -->
  <rect class="animated-border" x="0.5" y="0.5" width="849" height="299" rx="8" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>
